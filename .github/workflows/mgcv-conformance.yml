              "Every case's null-space penalty is built independently in Python "
              "from that term's own already-verified penalty block(s) (never "
              "from this script's own S) via eigendecomposition of their "
              "unscaled sum. A disagreement is a real result about the rule "
              "itself (module docstring), not a broken round trip.",
          ]
          if not all_agree:
              lines.insert(2, "**Disagreement — see the table. This is a genuine finding.**")

          report = "\n".join(lines) + "\n"
          with open("gam_select_penalty_probe_report.md", "w") as fh:
              fh.write(report)
          print(report)
          PY
          if [ -f gam_select_penalty_probe_report.md ]; then
            cat gam_select_penalty_probe_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

