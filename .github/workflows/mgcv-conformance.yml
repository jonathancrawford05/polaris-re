# =============================================================================
# Polaris RE — mgcv conformance run
# =============================================================================
# The R half of slice 5, executed. `docs/RUNBOOK_mgcv_conformance.md` describes
# two maintainer commands; this runs the second and third of them against the
# committed synthetic exchange, so `tr(F)`, the Kass-Steffey covariance and
# Wood's `gamma` can move from *adopted* to *verified or refuted* (PLAN Anchor 8)
# without anyone installing R.
#
# ADR-151 / Anchor 5 keep R out of the pytest suite, and that still holds: no job
# here runs pytest, and `rscript_mgcv_available()` still returns False everywhere
# CI runs Python. R appears only inside a pinned container, in its own job, on a
# path-filtered trigger — so an ordinary PR that touches none of the conformance
# files never pulls an image and never grows an R dependency.
#
# A DISAGREEMENT IS A RESULT, NOT A BROKEN BUILD — and the gate is built around
# that sentence rather than in tension with it.
#
# The comparator exits 2 whenever ANY level disagrees, so gating on its exit
# status alone would make this workflow permanently red the moment a level is
# refuted. It already is: the 2026-08-10 run verified `tr(F)` (levels 1-3 agree)
# and REFUTED the Kass-Steffey covariance (level 4). Both are results. Only one of
# them should stop a merge.
#
# So the gate is: FAIL on levels 1-3, ANNOTATE on levels 4-5.
#
#   * levels 1-3 are slice 5's acceptance criteria (PLAN slice 5) and they AGREE
#     today. A regression there means our penalized IRLS, our REML search or
#     `tr(F)` stopped matching mgcv — a defect, and it must block.
#   * levels 4-5 are findings under active work (the level-4 under-inflation is a
#     BLOCKER against slice 4's arithmetic, tracked in PRODUCT_DIRECTION). They are
#     surfaced as warnings and in the job summary, and they do not block.
#   * exit 1 — "could not compare at all": a hash mismatch, a missing reference, a
#     partial R run — always blocks. That is not a finding, it is an absent answer.
#
# A LEVEL THAT WAS NOT MEASURED IS TREATED AS A FAILURE, not a pass. Silence is the
# one outcome that must never read as success here: an R run that fitted no fixed-λ
# cells would otherwise report "level 1: not present" and sail through.
# =============================================================================

name: mgcv conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/mgcv_conformance.R"
      - "scripts/compare_mgcv_conformance.py"
      - "scripts/export_mgcv_case.py"
      - "src/polaris_re/analytics/experience_mgcv_conformance.py"
      # The module UNDER test, not just the harness. Without this line a change to
      # the penalized fitter or the Kass-Steffey correction does not run the check
      # that measures it — which is exactly the shape of the level-4 work (ADR-190).
      - "src/polaris_re/analytics/experience_gam_penalized.py"
      - "data/mgcv_exchange/**"
      - ".github/workflows/mgcv-conformance.yml"

permissions:
  contents: read

concurrency:
  group: mgcv-conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  # The levels that BLOCK a merge, as a visible policy rather than a shell condition
  # buried in a step. These are slice 5's acceptance criteria; 4 and 5 are findings
  # under active work. Widening this list is a deliberate, reviewable edit — and
  # NARROWING it to go green is the move the epic has refused twice already.
  REQUIRED_LEVELS: "1,2,3"
  # Digest-pinned, never a tag: the whole suite rests on the reference not moving
  # between runs, and `:latest` would let an mgcv update rewrite the oracle
  # silently. Bumping this is a reviewable commit with a re-run attached.
  # Currently R 4.6.1 / mgcv 1.9.4 / jsonlite 2.0.0 / mboost 2.9.13, CRAN snapshot
  # 2026-08-01 — upstream build 8, the first build with host-independent numerics.
  #
  # A TAG STOPPED IDENTIFYING A BUILD, AND THAT IS THE ARGUMENT FOR THIS LINE.
  # The 2026-08-10 rebuild added `mboost` without moving R, mgcv or the snapshot, and the
  # `r4.6.1-2026-08-01` tag was moved onto it. That tag *looks* like it encodes everything
  # relevant — R version and snapshot date — and it no longer did: anyone pinning it
  # silently picked up a package that was not there before. Nothing broke, because the
  # addition was additive and this workflow pins the digest. But the tag was a reasonable
  # thing to trust, and it was wrong. Digest, always.
  #
  # RESOLVED UPSTREAM (R-Gam-base PR #3, 2026-08-11): tags are now immutable and never
  # reused, named `r<R>-cran<snapshot>-b<NN>`, with the build number carrying the
  # distinction when the version fields cannot. `BUILDS.md` in that repo is the catalog,
  # keyed on digest. `r4.6.1-2026-08-01` is DEPRECATED rather than deleted — GHCR has no
  # per-tag delete, and that tag sits on the digest below, so removing it would have meant
  # deleting a package version this workflow pins. Demotion was the right call.
  #
  # THE THREE BUILDS THIS FILE HAS PINNED:
  #   build 1  sha256:a77a61cf2319…ce8e  2026-08-09  no mboost   ← pinned 0c149e3..105996e
  #   build 2  sha256:8853bf2b6009…b7c   2026-08-11  mboost      ← pinned f16432c..fb3d31e
  #   build 8  sha256:0d54c192e23c…0fd8  2026-08-11  determinism ← pinned from here
  # ADR-189 amendment 1's numbers — `tr(F)` at 7.2e-13 and the level-4 refutation — were
  # produced on BUILD 1. Each bump was verified by re-running this workflow, never assumed.
  # Upstream asserts the locked set byte-identical across all three (mgcv 1.9.4, Matrix
  # 1.7.5, nlme 3.1.169, jsonlite 2.0.0, digest 0.6.39) — which covers Matrix and nlme, the
  # place an `mboost` dependency could have moved mgcv's numerics with its own version
  # unchanged.
  #
  # WHY BUILD 8, AND THE REASON IS NOT `mboost`. Upstream found that builds 1-7 were NOT
  # host-independent: OpenBLAS sized its thread pool from the runner's core count, and the
  # differing reduction order moved the last bits — two stable outputs, roughly 50/50, with
  # every package version identical. Build 8 pins `OPENBLAS_NUM_THREADS=1`, and upstream CI
  # now diffs each build's reference-output hashes against the previous build's so it cannot
  # recur silently.
  #
  # That defect could not have flipped a verdict here: the tightest committed tolerance is
  # 1e-09 on `max_abs_eta_diff` against 2.9e-14 observed, and a last-bit reduction
  # difference is ~1e-16 relative. But this file is about to be used for something stricter.
  # PLAN_mgcv_parity_engine.md Anchor 1 compares design matrices term by term, and measured
  # `lpmatrix` fidelity at 3.553e-15 — the same order as the nondeterminism. On builds 1-7 a
  # Stage-A disagreement at that scale could be the runner's core count rather than our
  # basis, which is exactly the attribution the two-stage strategy exists to make possible.
  # Determinism is a prerequisite for slice 1, not a nicety.
  #
  # The metric to watch across this bump is level 2's `max_abs_log10_sp_diff`: 4.3221e-01
  # observed against a 5.0e-01 tolerance, the only committed metric without an order of
  # magnitude of headroom. Smoothing-parameter selection is an optimisation, so last-bit
  # input noise can move a selected lambda by much more than last-bit.
  #
  # mboost is present for the maintainer's exploratory `gamboost` work. It is NOT a parity
  # target (docs/PLAN_mgcv_parity_engine.md §1: componentwise boosting is a different
  # algorithm with no likelihood covariance), and nothing in this workflow uses it — so if
  # a future rebuild drops it, this suite is unaffected.
  ORACLE_IMAGE: ghcr.io/jonathancrawford05/r-gam-base@sha256:0d54c192e23c62bdc614eb5b534e04482f6cf92290e76cacb7956022cd806fd8

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: the R side — fit every cell, emit one reference JSON
  # ---------------------------------------------------------------------------
  mgcv-reference:
    name: mgcv reference (R)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # `docker run` rather than a job-level `container:`. The oracle image is
      # built from rocker/r-ver, which ships no git, so actions/checkout inside it
      # would fall back to a REST tarball download. Checking out on the host and
      # mounting the workspace keeps the image a pure R runtime with nothing in it
      # to satisfy Actions.
      - name: Fit every cell with mgcv
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work "$ORACLE_IMAGE" \
            Rscript scripts/mgcv_conformance.R \
              data/mgcv_exchange/synthetic \
              mgcv_reference.json

      - name: Record the R environment that produced it
        run: |
          {
            echo "## mgcv reference"
            echo
            echo "- image \`$ORACLE_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("mgcv_reference.json"))
          for k in ("r_version", "mgcv_version", "jsonlite_version",
                    "scale_penalty", "exchange_sha256"):
              print(f"- `{k}`: `{d.get(k)}`")
          print(f"- cells fitted: **{len(d.get('cells', {}))}**")
          PY

      # ADR-190's decisive measurement, on the authoritative oracle. DIAGNOSTIC ONLY —
      # it asserts nothing and cannot fail the build; the comparison job is what gates.
      # It exists so ADR-190's central claim carries a TIER 3 label rather than an
      # argument for why tier 1 was good enough (PR #195 review, [P0]).
      - name: Probe whether Vc equals Vb + J V_rho J' (ADR-190)
        # THE LINE THAT MAKES THE "DIAGNOSTIC ONLY" CLAIM TRUE RATHER THAN INTENDED.
        # Without it the claim was prose in three places and an assertion in none: the step
        # runs `set -euo pipefail`, the R script has four `stop()` paths, and `compare`
        # declares `needs: mgcv-reference` — so a renamed `outer.info$hess` in some future
        # mgcv, or a manifest with no free-sp gamma=1 cell, would redden the levels 1-3
        # gate. That inverts this file's own policy by letting a level-4 diagnostic block a
        # merge. PR #195 review [P1], and the same shape as the finding the probe measures.
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work "$ORACLE_IMAGE" \
            Rscript scripts/ks_formula_probe.R \
              data/mgcv_exchange/synthetic \
              ks_formula_probe.json
          {
            echo
            echo "### ADR-190 — is \`Vc\` equal to \`Vb + J V_rho Jᵀ\`?"
            echo
            echo "| cell | \`mean diag(Vc-Vp)\` | \`mean diag(J V_rho Jᵀ)\` | ratio | inflation from formula | mgcv reports |"
            echo "|---|---:|---:|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("ks_formula_probe.json"))
          for name, c in d["cells"].items():
              print(
                  f"| `{name}` | {c['mean_diag_vc_minus_vp']:.5e} | "
                  f"{c['mean_diag_j_vrho_jt']:.5e} | "
                  f"{c['ratio_actual_over_formula']:.4f} | "
                  f"{c['inflation_from_formula']:.4f} | "
                  f"**{c['inflation_reported']:.4f}** |"
              )
          print()
          print("A ratio far from 1.0 means the formula, not the arithmetic, is the gap.")
          PY

      # PLAN_mgcv_parity_engine.md slice 1's one named risk, on the authoritative oracle.
      # DIAGNOSTIC ONLY, same contract as the ADR-190 probe above: it has `stop()` paths
      # and can exit non-zero, and `continue-on-error: true` is what stops that from
      # blocking a merge. No exchange dependency — it builds its own tiny `bs="cr"` case,
      # so it runs even before slice 2 ships a real cr basis.
      - name: Probe whether smoothCon(absorb.cons=TRUE) reproduces lpmatrix (slice 1)
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work "$ORACLE_IMAGE" \
            Rscript scripts/smoothcon_lpmatrix_probe.R \
              smoothcon_lpmatrix_probe.json
          {
            echo
            echo "### Slice 1 — does \`smoothCon(absorb.cons=TRUE)\$X\` equal \`lpmatrix\`'s smooth block?"
            echo
            echo "| case | dim | rank | max|lpmatrix - smoothCon X| | max|S diff| |"
            echo "|---|---|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("smoothcon_lpmatrix_probe.json"))
          for name, c in d["cases"].items():
              dim = "x".join(str(v) for v in c["dim_x"])
              print(
                  f"| `{name}` | {dim} | {c['rank']} | "
                  f"{c['max_abs_diff_lpmatrix_vs_smoothcon_x']:.3e} | "
                  f"{c['max_abs_diff_gam_smooth_S_vs_smoothcon_S']:.3e} |"
              )
          print()
          print("Zero (to the printed precision) means the two Stage-A referents PLAN §5 "
                "risk 1 worried about are the same object, not two competing choices.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mgcv-reference
          path: |
            mgcv_reference.json
            ks_formula_probe.json
            smoothcon_lpmatrix_probe.json

  # ---------------------------------------------------------------------------
  # Job 2: the comparison — Python, no R
  # ---------------------------------------------------------------------------
  compare:
    name: Compare against the Python reference
    runs-on: ubuntu-latest
    needs: mgcv-reference
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - uses: actions/download-artifact@v4
        with:
          name: mgcv-reference
          path: .

      # The comparator re-hashes the exchange before it reads either reference, so
      # a mismatch between what R fitted and what is committed stops here.
      #
      # Its exit status is captured rather than gated on: 0 = every level agrees,
      # 2 = some level disagrees, 1 = could not compare. Only 1 is a defect on its
      # own; 2 needs the per-level verdicts to decide, which is the next step.
      - name: Compare the two references
        id: compare
        run: |
          set -uo pipefail
          rc=0
          uv run python scripts/compare_mgcv_conformance.py \
            --exchange data/mgcv_exchange/synthetic \
            --mgcv-reference mgcv_reference.json \
            --markdown mgcv_conformance_report.md \
            --output mgcv_conformance.json || rc=$?
          echo "comparator exit status: $rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error title=Conformance could not be compared::The comparator" \
                 "exited $rc — it did not produce a verdict. Expected 0 (all levels" \
                 "agree) or 2 (some level disagrees). Exit 1 means the comparison was" \
                 "refused: a hash mismatch, a missing reference, or a partial R run." \
                 "See the step log; an absent answer is not a finding."
            exit 1
          fi

      # THE GATE. Fails on REQUIRED_LEVELS, annotates on the rest — see the header.
      # Separate from the step above so the failure message names the level rather
      # than an exit code, and so the report is published either way.
      - name: Gate on levels 1-3, annotate levels 4-5
        run: |
          python3 - <<'PY'
          import json, os, sys

          required = {int(x) for x in os.environ["REQUIRED_LEVELS"].split(",") if x.strip()}
          try:
              data = json.load(open("mgcv_conformance.json"))
          except (OSError, json.JSONDecodeError) as exc:
              print(f"::error title=No comparison JSON::{exc}")
              sys.exit(1)

          settled = {int(k): bool(v) for k, v in data.get("levels_settled", {}).items()}
          lines = ["", "## Gate", "", "| level | verdict | blocking |", "|---|---|---|"]
          failed = []

          # Absence is a failure, not a pass: a run that fitted no fixed-lambda cells
          # would report level 1 as simply missing.
          for level in sorted(required):
              if level not in settled:
                  failed.append(f"level {level} was NOT MEASURED")
                  lines.append(f"| {level} | **NOT MEASURED** | yes |")
              elif not settled[level]:
                  failed.append(f"level {level} DISAGREES")
                  lines.append(f"| {level} | **DISAGREES** | yes |")
              else:
                  lines.append(f"| {level} | agrees | yes |")

          for level in sorted(set(settled) - required):
              verdict = "agrees" if settled[level] else "**DISAGREES** (finding)"
              lines.append(f"| {level} | {verdict} | no |")
              if not settled[level]:
                  print(
                      f"::warning title=Level {level} disagrees::A finding, not a defect. "
                      f"Levels 4-5 are not slice-5 acceptance criteria and do not block. "
                      f"Level 4's under-inflation is tracked as a BLOCKER against slice 4's "
                      f"Kass-Steffey arithmetic in PRODUCT_DIRECTION."
                  )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")

          if failed:
              print(
                  "::error title=Conformance regression on a required level::"
                  + "; ".join(failed)
                  + f". Levels {sorted(required)} are slice 5's acceptance criteria and "
                  "agreed as of 2026-08-10 — a change here means our penalized IRLS, our "
                  "REML search or tr(F) stopped matching mgcv. Do NOT widen a tolerance "
                  "to clear this."
              )
              sys.exit(1)
          print(f"Required levels {sorted(required)} all agree.")
          PY

      # Runs even when the comparison fails: on a disagreement the table IS the
      # deliverable, and burying it in a red step defeats the purpose of the run.
      - name: Publish the report
        if: always()
        run: |
          if [ -f mgcv_conformance_report.md ]; then
            cat mgcv_conformance_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The comparator produced no report — see the step log." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mgcv-conformance-report
          path: |
            mgcv_conformance_report.md
            mgcv_conformance.json
            mgcv_reference.json
