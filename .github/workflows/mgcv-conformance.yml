              "| n | p | max abs eta diff | max abs log10(sp) diff | edf_total diff | "
              "max abs per-term edf diff | at bound | converged | agrees |",
              "|---:|---:|---:|---:|---:|---:|---|---|---|",
              f"| {r_payload['n']} | {len(r_payload['coef'])} | "
              f"{c['max_abs_eta_diff']:.3e} | {c['max_abs_log10_sp_diff']:.4f} | "
              f"{c['edf_total_diff']:+.4f} | {c['max_abs_term_edf_diff']:.4f} | "
              f"{c['at_bound']} | {c['converged']} | {c['agrees']} |",
              "",
              "**This is the same recipe as ladder L1 (ADR-229), only the fitting "
              "regime changed** — from a caller-supplied fixed sp to mgcv's own "
              "free-sp REML selection, now reachable because this slice's "
              "free-scale REML branch gives `select_lambdas_continuous` a "
              "criterion to search. The gate is ADR-221's committed criterion, "
              "imported and never redeclared (Anchor W5). `sp` is a COMPARED "
              "QUANTITY here, not a shared input — reported, not gated. "
              "Coefficients are NOT compared (Anchor 2).",
              "",
              f"**Offset tripwire** (reported, never gated): {c['offset_gap']:.3e}.",
          ]
          if not c["agrees"]:
              lines.insert(2, "**Disagreement — see the table. This is a genuine finding.**")

          report = "\n".join(lines) + "\n"
          with open("gam_gaussian_free_sp_probe_report.md", "w") as fh:
              fh.write(report)
          print(report)
          PY
          if [ -f gam_gaussian_free_sp_probe_report.md ]; then
            cat gam_gaussian_free_sp_probe_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # PLAN slice 7b (ADR-218): does mgcv's OWN free-sp select=TRUE point
      # score better, under our OWN criterion (ADR-217's fixed-sp fix),
      # than our best-of-9 multistart result reaches — same discriminator
      # ADR-211/212 used at N=4 (slice 5d). DIAGNOSTIC ONLY — reads mgcv's
      # own sp as an input (x0), so this can never be part of the committed
      # INDEPENDENT comparator above, same reasoning as
      # gam_free_sp_warmstart_diagnostic.py / gam_multiterm_sp_delta_probe.R.
      - name: Does mgcv's own select=TRUE free-sp point score better than our best multistart result? (slice 7b)
        if: always()
        continue-on-error: true
        run: |
          if [ -f gam_select_multiterm_free_sp_probe.json ]; then
            uv run python scripts/gam_select_free_sp_warmstart_diagnostic.py gam_select_multiterm_free_sp_probe.json \
              | tee gam_select_free_sp_warmstart_diagnostic_output.txt
            {
              echo ""
              echo "### Slice 7b — warm-start-at-mgcv's-point diagnostic (NOT part of SELECT_FREE_SP_MODEL_CLAIM)"
              echo '```'
              cat gam_select_free_sp_warmstart_diagnostic_output.txt
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No gam_select_multiterm_free_sp_probe.json to diagnose — the R probe did not produce one." >> "$GITHUB_STEP_SUMMARY"
          fi

      # PLAN slice 7c (ADR-219): is the 1e-2 gate on raw log10(sp) REACHABLE on
      # this structure at all? Reads the curvature of OUR OWN REML criterion at
      # the point mgcv selected -- eigenspectrum, step-stability scan, per-block
      # profile. NOT A COMPARISON: mgcv's sp is the POINT of evaluation, never an
      # operand, so this carries no VerificationClaim and the ledger rows use the
      # third category MEASUREMENT (own criterion), VERIFICATION_STANDARD.md
      # §2.1. It can never carry a parity claim.
      #
      # Wired in per ADR-219 amendment 1 decision 1: the tier-1 reading is taken
      # at mgcv 1.9-1 and the eigenspectrum has never been read at tier 3. The
      # point it is evaluated at is version-dependent in principle (ADR-218's own
      # cross-tier readings agree to 4 s.f., so the risk is small), and this step
      # closes it for free on the next tier-3 run.
      - name: Is the log10(sp) gate reachable? Own-criterion curvature at mgcv's point (slice 7c)
        if: always()
        continue-on-error: true
        run: |
          if [ -f gam_select_multiterm_free_sp_probe.json ]; then
            uv run python scripts/gam_select_free_sp_identifiability_diagnostic.py \
              gam_select_multiterm_free_sp_probe.json \
              | tee gam_select_free_sp_identifiability_output.txt
            {
              echo ""
              echo "### Slice 7c — is the gate reachable? MEASUREMENT (own criterion), NOT a comparison"
              echo ""
              echo "Every number below is our own REML criterion's geometry. \`mgcv\`'s selection"
              echo "is the POINT of evaluation, never an operand — so this is neither INDEPENDENT"
              echo "nor ECHO/TRANSPORT (\`docs/VERIFICATION_STANDARD.md\` §2.1) and **says nothing"
              echo "about agreement with \`mgcv\`**."
              echo '```'
              cat gam_select_free_sp_identifiability_output.txt
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No gam_select_multiterm_free_sp_probe.json to read — the R probe did not produce one." >> "$GITHUB_STEP_SUMMARY"
          fi

      # PLAN slice 7d: does the analytic REML gradient (gam_reml_gradient,
      # SciPy's own jac=True protocol) change select_lambdas_continuous's own
      # behaviour on this 7-block select=TRUE structure, and is SciPy's
      # converged flag trustworthy now that the gradient it receives is exact?
      # The blind rows reuse the SAME INDEPENDENT comparator as
      # SELECT_FREE_SP_MODEL_CLAIM (slice 7b's own step above already reports
      # eta/edf/log10(sp) for them); this step adds the true-gradient-norm and
      # SciPy-termination-message columns that comparator does not carry. The
      # warm-start row is DIAGNOSTIC (x0 is mgcv's own selection, TRANSPORT).
      - name: Does the analytic REML gradient change the search, and is converged trustworthy? (slice 7d)
        if: always()
        continue-on-error: true
        run: |
          if [ -f gam_select_multiterm_free_sp_probe.json ]; then
            OPENBLAS_NUM_THREADS=1 uv run python scripts/gam_reml_gradient_diagnostic.py \
              gam_select_multiterm_free_sp_probe.json \
              | tee gam_reml_gradient_diagnostic_output.txt
            {
              echo ""
              echo "### Slice 7d — analytic gradient vs finite difference, and SciPy convergence-flag reliability"
              echo '```'
              cat gam_reml_gradient_diagnostic_output.txt
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No gam_select_multiterm_free_sp_probe.json to diagnose — the R probe did not produce one." >> "$GITHUB_STEP_SUMMARY"
          fi

      # PLAN slice 5b (docs/WORK_ORDER_multi_term_assembly.md): compares
      # PolarisGAM's own free-sp selection (gam_model_conformance) against
      # job 1's native mgcv free-sp REML fit of the SAME three-term formula.
      # THE ASYMMETRY (work order Sec. 3): unlike the fixed-sp comparison
      # above, mgcv's own sp is a COMPARED QUANTITY here, not a shared input
      # — both sides choose it independently. DIAGNOSTIC ONLY, printed to
      # stdout from the start (ADR-194's methodology fix).
      - name: Compare PolarisGAM's free-sp selection against mgcv (slice 5b)
        if: always()
        continue-on-error: true
        run: |
          uv run python3 - <<'PY'
          import json
          import sys

          try:
              r_payload = json.load(open("gam_multiterm_free_sp_probe.json"))
          except (OSError, json.JSONDecodeError) as exc:
              print(f"No gam_multiterm_free_sp_probe.json to compare ({exc}) — "
                    "the R probe above did not produce one.")
              sys.exit(0)

          from polaris_re.analytics.gam_model_conformance import (
              FREE_SP_MODEL_CLAIM, compare_free_sp_case, fit_free_sp_case,
          )
          from polaris_re.core.verification import evidence_markdown

          fit = fit_free_sp_case(r_payload)
          c = compare_free_sp_case(fit, r_payload)

          lines = [
              "",
              "### Slice 5b — PolarisGAM free-sp selection vs mgcv (INDEPENDENT on every quantity)",
              "",
              evidence_markdown(FREE_SP_MODEL_CLAIM),
              "",
              "| n | p | max abs eta diff | max abs log10(sp) diff | edf_total diff | max abs per-term edf diff | at bound | agrees |",
              "|---:|---:|---:|---:|---:|---:|---|---|",
              f"| {r_payload['n']} | {len(r_payload['coef'])} | "
              f"{c.max_abs_eta_diff:.3e} | {c.max_abs_log10_sp_diff:.4f} | "
              f"{c.edf_total_diff:+.4f} | {c.max_abs_term_edf_diff:.4f} | "
              f"{c.at_bound} | {c.agrees} |",
              "",
              "`sp` is a COMPARED QUANTITY here, not a shared input (see the "
              "legend) — the work order's own asymmetry versus the fixed-sp "
              "comparison above: both sides select their own smoothing "
              "parameters independently, from the same already-verified "
              "REML criterion (ADR-196/197/199). A disagreement localises to "
              "lambda selection on this N=4-block design, not to the bases, "
              "fitter or criterion, all unchanged from the fixed-sp "
              "measurement. Coefficients are NOT compared (Anchor 2).",
          ]
          if not c.agrees:
              lines.insert(2, "**Disagreement on log10(sp) — see the table. This is a genuine finding.**")

          report = "\n".join(lines) + "\n"
          with open("gam_multiterm_free_sp_probe_report.md", "w") as fh:
              fh.write(report)
          print(report)
          PY
          if [ -f gam_multiterm_free_sp_probe_report.md ]; then
            cat gam_multiterm_free_sp_probe_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # PLAN slice 5d's cheap first step, extended: does mgcv's own free-sp
      # point score BETTER, under our OWN now-fixed criterion (ADR-210), than
      # our optimiser's own blind (default-start) result — discriminating
      # "our search doesn't converge precisely enough" from "mgcv reaches a
      # point ours cannot". DIAGNOSTIC ONLY (the warm start reads mgcv's own
      # sp as an input) — same status as gam_multiterm_sp_delta_probe.R,
      # never part of FREE_SP_MODEL_CLAIM. `OPENBLAS_NUM_THREADS=1` above is
      # what makes this reading reproducible across runs of this job.
      - name: Does mgcv's own free-sp point score better than our blind search's own result? (slice 5d)
        if: always()
        continue-on-error: true
        run: |
          if [ -f gam_multiterm_free_sp_probe.json ]; then
            uv run python scripts/gam_free_sp_warmstart_diagnostic.py gam_multiterm_free_sp_probe.json \
              | tee gam_free_sp_warmstart_diagnostic_output.txt
            {
              echo ""
              echo "### Slice 5d — warm-start-at-mgcv's-point diagnostic (NOT part of FREE_SP_MODEL_CLAIM)"
              echo '```'
              cat gam_free_sp_warmstart_diagnostic_output.txt
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No gam_multiterm_free_sp_probe.json to diagnose — the R probe did not produce one." >> "$GITHUB_STEP_SUMMARY"
          fi

      # PLAN slice 5c sequencing step 1 (tier-3 baseline) — the eight-point
      # fixed-sp spread, both before Defects A/B (raw) and after (this
      # branch's reml_score_general, which already carries the fix — the
      # "before" figure is the tier-1 measurement in the ADR, re-derived
      # here isn't possible without checking out the pre-fix commit).
      # INDEPENDENT parity evidence (gam_reml_optimize_conformance.
      # FIXED_SP_MULTITERM_REML_CLAIM, PR #215 review [P1-1]) — neither side's
      # producer reads the other's score/eta/coef; printed to stdout directly
      # by the script itself, same discipline as the slice 4 part A step below.
      - name: Fixed-sp REML score spread vs mgcv, Appendix B + observed-Hessian weight (slice 5c)
        if: always()
        continue-on-error: true
        run: |
          # `tee` rather than a group-redirect into $GITHUB_STEP_SUMMARY alone
          # (the mistake ADR-192's "job-summary-artifact limitation" backlog
          # item warns about): the summary is not part of the regular job
          # log stream, so a step that ONLY writes there leaves a tier-3
          # reader unable to verify anything beyond "the step didn't except"
          # — exactly the limitation this pattern is written to avoid.
          if [ -f gam_fixed_sp_score_probe.json ]; then
            uv run python scripts/gam_fixed_sp_score_compare.py gam_fixed_sp_score_probe.json \
              | tee gam_fixed_sp_score_compare_output.txt
            {
              echo ""
              echo "### Slice 5c — fixed-sp REML score spread vs mgcv (Defects A + B)"
              echo '```'
              cat gam_fixed_sp_score_compare_output.txt
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No gam_fixed_sp_score_probe.json to compare — the R probe did not produce one." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Slice 4 part A: compares the independent Python REML score
      # (gam_reml.reml_score_general on an independently-converged
      # gam_fit.penalized_irls_general fit) against job 1's mgcv gcv.ubre on
      # the SAME shared two-block binomial design at three fixed sp points —
      # on PAIRWISE DIFFERENCES, not the absolute value (see
      # gam_reml_conformance.py's module docstring for why). DIAGNOSTIC ONLY,
      # printed to stdout from the start (the methodology fix ADR-194 needed
      # partway through slice 2), so a tier-3 read never has to settle for
      # "the step didn't except."
      - name: Compare the two-block REML score against the Python side (slice 4 part A)
        if: always()
        continue-on-error: true
        run: |
          uv run python3 - <<'PY'
          import json
          import sys

          try:
              r_payload = json.load(open("gam_reml_probe.json"))
          except (OSError, json.JSONDecodeError) as exc:
              print(f"No gam_reml_probe.json to compare ({exc}) — the R probe "
                    "above did not produce one.")
              sys.exit(0)

          import numpy as np

          from polaris_re.analytics.gam_reml_conformance import (
              REML_SCORE_CLAIM, compare_reml_deviance, compare_reml_points,
          )
          from polaris_re.core.verification import evidence_markdown

          x = np.asarray(r_payload["X"], dtype=np.float64)
          s1 = np.asarray(r_payload["S1"], dtype=np.float64)
          s2 = np.asarray(r_payload["S2"], dtype=np.float64)

          lines = [
              "", "### Slice 4 part A — two-block REML score vs mgcv (INDEPENDENT)", "",
              evidence_markdown(REML_SCORE_CLAIM), "",
              "#### deviance (per point, absolute — rules out a rescaled-penalty artifact)",
              "",
              "| sp | python deviance | r deviance | diff | agrees |",
              "|---|---:|---:|---:|---|",
          ]
          deviance_comparisons = compare_reml_deviance(x, s1, s2, r_payload)
          any_deviance_disagree = False
          for d in deviance_comparisons:
              if not d["agrees"]:
                  any_deviance_disagree = True
              lines.append(
                  f"| `{d['sp']}` | {d['python_deviance']:.10g} | {d['r_deviance']:.10g} | "
                  f"{d['diff']:.6g} | {d['agrees']} |"
              )
          lines += [
              "",
              "#### reml_score_pairwise_diff (the declared claim quantity)",
              "",
              "| point A | point B | python diff | r diff | residual | agrees |",
              "|---|---|---:|---:|---:|---|",
          ]
          comparisons = compare_reml_points(x, s1, s2, r_payload)
          any_score_disagree = False
          for c in comparisons:
              if not c["agrees"]:
                  any_score_disagree = True
              lines.append(
                  f"| `{c['point_a']}` | `{c['point_b']}` | {c['python_diff']:.6g} | "
                  f"{c['r_diff']:.6g} | {c['residual']:.6g} | {c['agrees']} |"
              )
          lines.append("")
          lines.append(
              "`deviance` and `reml_score_pairwise_diff` are both INDEPENDENT (see "
              "the legend): neither side reads the other's fit or score, only the "
              "shared recipe (X, S1, S2, y, weights) and the sp points themselves. "
              "`deviance` agreeing is what licenses reading a score disagreement as "
              "a formula gap rather than a rescaled-penalty artifact (mgcv's "
              "gam.control(scalePenalty=) would fit both sides at a different "
              "effective lambda and show up here first). Differencing the score "
              "pairwise cancels any purely additive convention offset between the "
              "two criteria (ADR-189 amendment 1 already found one, unresolved, "
              "even for the single-block Poisson case) — a residual surviving THAT "
              "cancellation is a real result about the multi-block formula, not a "
              "broken round trip or an artifact of the offset."
          )
          if any_score_disagree:
              lines.insert(2, "**The score disagreed on at least one pair — see the table. This is a genuine, characterized finding, not a harness bug.**")
          if any_deviance_disagree:
              lines.insert(2, "**DEVIANCE DISAGREED — the fit itself may be wrong, not just the score. See the table before trusting any score-level conclusion.**")

          report = "\n".join(lines) + "\n"
          with open("gam_reml_probe_report.md", "w") as fh:
              fh.write(report)
          print(report)
          PY
          if [ -f gam_reml_probe_report.md ]; then
            cat gam_reml_probe_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # docs/WORK_ORDER_reml_penalized_deviance_production_check.md: does the
      # SHIPPED, production experience_gam_penalized.reml_score have the same
      # missing beta_hat^T S beta_hat term ADR-196 found and fixed in
      # gam_reml.reml_score_general? Reads mgcv_reference.json (job 1, already
      # produced on every dispatch — reml_score/m$gcv.ubre was already
      # exported, so no new R work) and the COMMITTED python_reference.json
      # (never re-baselined by this step — read-only). DIAGNOSTIC ONLY, same
      # contract as every probe above: this measures against experience_gam_
      # penalized.reml_score/select_lambdas_reml/smoothing_uncertainty but
      # calls none of their production entry points for a fit that would
      # move any committed artifact, and edits none of them (PLAN Anchor 7).
      - name: Check the production REML score for the same missing term (work order)
        if: always()
        continue-on-error: true
        run: |
          uv run python scripts/reml_production_check_probe.py \
            --exchange data/mgcv_exchange/synthetic \
            --mgcv-reference mgcv_reference.json \
            > reml_production_check_report.md
          cat reml_production_check_report.md
          cat reml_production_check_report.md >> "$GITHUB_STEP_SUMMARY"

      # PLAN slice 4 part B, ADR-198's decisive test: does a continuous search
      # over log10(lambda) — never reading mgcv's own selection — land closer
      # to mgcv's own free-sp selection than the production grid does? Reads
      # mgcv_reference.json (job 1, already produced on every dispatch — the
      # free-sp `sp`/`edf_total` fields were already exported, so no new R
      # work) and the COMMITTED python_reference.json (read-only, for the
      # grid's own already-selected lambda). DIAGNOSTIC ONLY, same contract
      # as every probe above: it fits its own independent search, calling
      # none of experience_gam_penalized.py's production entry points and
      # editing none of them (PLAN Anchor 7).
      - name: Does a continuous search land closer to mgcv than the grid (slice 4 part B, ADR-198)
        if: always()
        continue-on-error: true
        run: |
          uv run python scripts/reml_continuous_optimizer_probe.py \
            --exchange data/mgcv_exchange/synthetic \
            --mgcv-reference mgcv_reference.json \
            > reml_continuous_optimizer_report.md
          cat reml_continuous_optimizer_report.md
          cat reml_continuous_optimizer_report.md >> "$GITHUB_STEP_SUMMARY"

      # Wood (2011) sections 3.4 / Appendix D — the level-4 PREREQUISITE, not level 4
      # itself. Compares this engine's analytic d(eta)/d(rho) and dw/d(rho)
      # against a central difference of mgcv's OWN refits. Prints to stdout so a
      # tier-3 reading comes from plain job-log text (the ADR-194 methodology fix).
      - name: Wood (2011) derivatives — d(eta)/d(rho) and dw/d(rho) vs mgcv
        if: always()
        continue-on-error: true
        run: |
          if [ -f gam_deriv_probe.json ]; then
            uv run python scripts/gam_deriv_compare.py \
              --probe gam_deriv_probe.json \
              --markdown gam_deriv_report.md
            cat gam_deriv_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No gam_deriv_probe.json — the R probe above did not produce one."
          fi

      # Level 4 proper — eq. (7) against mgcv's vcov(unconditional = TRUE).
      - name: Level 4 — WPS (2016) eq. (7) vs mgcv Vc
        if: always()
        continue-on-error: true
        run: |
          if [ -f gam_vc_probe.json ]; then
            uv run python scripts/gam_vc_compare.py \
              --probe gam_vc_probe.json \
              --markdown gam_vc_report.md
            cat gam_vc_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No gam_vc_probe.json — the R probe above did not produce one."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mgcv-conformance-report
          path: |
            mgcv_conformance_report.md
            mgcv_conformance.json
            mgcv_reference.json
            gam_term_extract.json
            gam_term_extract_report.md
            gam_family_probe.json
            gam_family_probe_report.md
            gam_reml_probe.json
            gam_reml_probe_report.md
            reml_production_check_report.md
            reml_continuous_optimizer_report.md
            gam_deriv_probe.json
            gam_deriv_report.md
            gam_vc_probe.json
            gam_vc_report.md
            gam_multiterm_probe.json
            gam_multiterm_probe_report.md
            gam_multiterm_sz_probe.json
            gam_multiterm_sz_probe_report.md
            gam_select_penalty_probe.json
            gam_select_penalty_probe_report.md
            gam_select_multiterm_probe.json
            gam_select_multiterm_probe_report.md
            gam_re_probe.json
            gam_re_probe_report.md
            gam_re_free_sp_probe.json
            gam_re_free_sp_probe_report.md
            gam_free_scale_reml_score_probe.json
            gam_free_scale_reml_score_probe_report.md
            gam_gaussian_free_sp_probe.json
            gam_gaussian_free_sp_probe_report.md
