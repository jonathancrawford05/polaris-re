      # DIFFERENT penalized model, not the dashboard's form (which is
      # unpenalized) and not Anchor W6's target spec. Earlier revisions of this
      # step said otherwise; the premise was false.
      - name: Compare a 4-term penalized ANOVA HGAM against mgcv (wiring slice 1)
        if: always()
        continue-on-error: true
        run: |
          uv run python3 - <<'PY'
          import json
          import statistics
          import sys

          try:
              r_payload = json.load(open("gam_production_mi_probe.json"))
          except (OSError, json.JSONDecodeError) as exc:
              print(f"No gam_production_mi_probe.json to compare ({exc}) — "
                    "the R probe above did not produce one.")
              sys.exit(0)

          from polaris_re.analytics.gam_production_mi_conformance import (
              PRODUCTION_MI_MODEL_CLAIM, compare_production_mi_case,
              compare_r_internal_forms, fit_production_mi_case,
          )
          from polaris_re.core.verification import evidence_markdown

          localiser = compare_r_internal_forms(r_payload)
          multi = fit_production_mi_case(r_payload, multistart=True, n_starts=9)
          single = fit_production_mi_case(r_payload, multistart=False)
          rows = [
              ("multistart=True, n_starts=9 (PINNED — blocker D)", multi),
              ("single-start (recorded beside it — blocker D)", single),
          ]
          # Read the bounds off a real comparison rather than restating them,
          # so the summary cannot drift from what was actually applied.
          bounds = compare_production_mi_case(multi, r_payload, target="te")

          lines = [
              "",
              "### Production wiring slice 1 — a 4-term penalized ANOVA-shaped HGAM vs mgcv",
              "",
              evidence_markdown(PRODUCTION_MI_MODEL_CLAIM),
              "",
              "**The gate is ADR-221's committed criterion** — "
              f"`max_abs_eta_diff < {bounds.eta_tolerance}`, "
              f"`abs(edf_total_diff) < {bounds.edf_tolerance}` — imported, not redeclared "
              "(Anchor W5). `log10(sp)` is NOT gated and NOT differenced: "
              f"`te` carries {localiser.n_sp_te} smoothing parameters where the "
              f"re-expression carries {localiser.n_sp_anova}.",
              "",
              "#### Axes (1) and (2) — Polaris against each mgcv fit",
              "",
              "**Axis (2)'s `te()` is a DIFFERENT penalized model** — not the shipped "
              "dashboard's form (which is unpenalized) and not Anchor W6's target "
              "specification. ADR-227 amendment 1.",
              "",
              "| search | vs mgcv fit | max abs eta diff | edf_total diff | nfev | converged | at bound | agrees (ADR-221) |",
              "|---|---|---:|---:|---:|---|---|---|",
          ]
          results = {}
          for label, fit in rows:
              for target, what in (("anova", "s+s+ti — the same form our engine builds"),
                                   ("te", "mgcv te() — a penalized full tensor, NOT the dashboard's form and NOT W6")):
                  c = compare_production_mi_case(fit, r_payload, target=target)
                  results[(label, target)] = c
                  lines.append(
                      f"| {label} | {what} | {c.max_abs_eta_diff:.4e} | "
                      f"{c.edf_total_diff:+.4f} | {fit.n_function_evals} | "
                      f"{c.converged} | {c.at_bound} | {c.agrees} |"
                  )

          lines += [
              "",
              "#### Axis (3) — the localiser: mgcv's `te()` against mgcv's own `s+s+ti`",
              "",
              "Both producers are `mgcv`. **Polaris appears nowhere in this row**, so it is "
              "real evidence about `mgcv` and none about this engine "
              "(`docs/VERIFICATION_STANDARD.md` §5's own category for the R-side "
              "`smoothCon`/`lpmatrix` guard). It is what separates *our engine is wrong* "
              "from *the re-expression is not the target form*.",
              "",
              "| max abs eta diff | edf_total diff | p (te) | p (s+s+ti) | n sp | max span residual | ranks (te/anova/combined) | spans match | equivalent under ADR-221 |",
              "|---:|---:|---:|---:|---|---:|---|---|---|",
              f"| {localiser.max_abs_eta_diff:.4e} | {localiser.edf_total_diff:+.4f} | "
              f"{localiser.n_coef_te} | {localiser.n_coef_anova} | "
              f"{localiser.n_sp_te} vs {localiser.n_sp_anova} | "
              f"{localiser.max_span_residual:.3e} | "
              f"{localiser.rank_te}/{localiser.rank_anova}/{localiser.rank_combined} | "
              f"**{localiser.spans_match}** | "
              f"**{localiser.equivalent_within_adr221}** |",
              "",
              "`spans match` is **measured, not inferred from equal column counts** — two "
              "39-column bases can span different 39-dimensional subspaces. `max span "
              "residual` is the worse of the two-way projections "
              "`|X_anova - proj_col(X_te) X_anova|` and `|X_te - proj_col(X_anova) X_te|`; "
              "machine-precision zeros in both directions ARE mutual containment. That, "
              "plus three agreeing ranks, is what licenses **same span, DIFFERENT "
              "penalty** — and so what makes the `eta` gap attributable to the penalty "
              "rather than to the basis.",
          ]

          # The attribution that makes the finding actionable: how much of the
          # target-form gap is OURS, and how much is the re-expression's?
          gap_target = results[(rows[0][0], "te")].max_abs_eta_diff
          gap_engine = results[(rows[0][0], "anova")].max_abs_eta_diff
          if gap_target > 0:
              lines += [
