                  "| comparison (BOTH sides mgcv — Polaris absent) | max abs eta diff | edf_total diff | p |",
                  "|---|---:|---:|---:|",
                  f"| **unpenalized** (`fx=TRUE`) — the dashboard's condition | "
                  f"**{unpen['max_abs_eta_diff']:.4e}** | {unpen['edf_total_diff']:+.6f} | "
                  f"{unpen['n_coef_te']}/{unpen['n_coef_anova']} |",
                  f"| penalized (free `sp`) — what the axes above measure | "
                  f"{localiser.max_abs_eta_diff:.4e} | {localiser.edf_total_diff:+.6f} | "
                  f"{localiser.n_coef_te}/{localiser.n_coef_anova} |",
                  "",
                  "**So 100% of the penalized gap is generated by a penalty the shipped "
                  "model does not have.** Blocker A's premise is void: the `te(...)` came "
                  "from `TensorMIModel`'s docstring, whose same sentence glosses it as "
                  "\"a tensor-product B-spline surface\" — prose, not an mgcv formula. "
                  "Corroboration: the target formula at `PLAN_mgcv_parity_engine.md` §1 is "
                  "`s(AttdAge) + s(PolYear) + ti(AttdAge, PolYear) + …` — the ANOVA "
                  "decomposition, with no `te` anywhere.",
              ]

          spelling = r_payload.get("anova_spelling")
          if spelling:
              lines += [
                  "",
                  "#### Does the ANOVA decomposition's SPELLING matter?",
                  "",
                  "`mgcv`'s own `?ti` writes the decomposition as `ti(x) + ti(z) + ti(x,z)`, "
                  "not `s(x) + s(z) + ti(x,z)` as the plan's blocker A proposes, and "
                  "demonstrates it beside `te(x,z)` as a *different* model. So the first "
                  "challenge to the refutation above is \"you tested the wrong "
                  "decomposition\". Measured, not argued — entirely inside R:",
                  "",
                  "| comparison (BOTH sides mgcv — Polaris absent) | max abs eta diff | edf_total diff | verdict |",
                  "|---|---:|---:|---|",
                  f"| `s+s+ti` vs `ti+ti+ti` (does spelling change the fit?) | "
                  f"{spelling['s_vs_ti_max_abs_eta_diff']:.4e} | "
                  f"{spelling['s_vs_ti_edf_total_diff']:+.4f} | **identical** |",
                  f"| `te()` vs `ti+ti+ti` (mgcv's own spelling vs the target) | "
                  f"{spelling['te_vs_ti_anova_max_abs_eta_diff']:.4e} | "
                  f"{spelling['te_vs_ti_anova_edf_total_diff']:+.4f} | "
                  "**fails ADR-221 too** |",
                  "",
                  "So the refutation is **not** an artefact of choosing `s()` over `ti()` "
                  "for the single margins: the two spellings are the same fit to machine "
                  "precision, and mgcv's own documented decomposition misses `te()` by the "
                  "same amount ours does. (Neither spelling is expressible here anyway — a "
                  "one-margin `ti` is rejected by `TermSpec`, which requires >= 2 variables "
                  "for `basis=\"ti\"`.)",
              ]

          sweep = r_payload.get("sensitivity") or []
          if sweep:
              draw = [s for s in sweep if s.get("axis") == "draw"]
              kaxis = [s for s in sweep if s.get("axis") == "k"]
              lines += [
                  "",
                  "#### Axis (3), swept — is the gap structural or one unlucky cell?",
                  "",
                  "Entirely inside R. The **draw** axis varies the Poisson draw at the "
                  "headline `k`; the **k** axis varies basis dimension at one draw. The "
                  "`d dur_edf` column is the internal control: `s(duration_years)` is "
                  "STRUCTURALLY IDENTICAL in both formulas (it is not part of what `te` "
                  "decomposes), so it must stay ~0 while the age x year block does not.",
                  "",
                  "| axis | seed | k(age,year) | p | max abs eta diff | edf_total diff | d dur_edf | equivalent under ADR-221 |",
                  "|---|---:|---|---:|---:|---:|---:|---|",
              ]
              for s in sweep:
                  eq = s["max_abs_eta_diff"] < 2e-2 and abs(s["edf_total_diff"]) < 1.0
                  lines.append(
                      f"| {s.get('axis', '?')} | {s['seed']} | "
                      f"({s['age_k']},{s['year_k']}) | {s['n_coef_te']} | "
                      f"{s['max_abs_eta_diff']:.4e} | {s['edf_total_diff']:+.4f} | "
                      f"{s['duration_edf_diff']:+.2e} | {eq} |"
                  )
              if draw:
                  fails = sum(
                      1 for s in draw
                      if not (s["max_abs_eta_diff"] < 2e-2 and abs(s["edf_total_diff"]) < 1.0)
                  )
                  med = statistics.median(s["max_abs_eta_diff"] for s in draw)
                  lines += [
                      "",
                      f"**Draw axis: {fails} of {len(draw)} draws FAIL ADR-221's criterion**, "
                      f"median `max_abs_eta_diff` `{med:.4e}`. So the two forms agree on "
                      "SOME draws and not others — which is worse than a consistent bias, "
                      "because a single fit gives no way to tell which case you are in.",
                  ]
              if kaxis:
                  # Deliberately a SPREAD, not a pass count: this axis sits at
                  # ONE draw, so counting passes there would say more about
                  # that draw than about k.
                  lo = min(s["max_abs_eta_diff"] for s in kaxis)
                  hi = max(s["max_abs_eta_diff"] for s in kaxis)
                  p_lo = min(s["n_coef_te"] for s in kaxis)
                  p_hi = max(s["n_coef_te"] for s in kaxis)
                  lines += [
                      f"**k axis** (anchored on one draw that DISAGREES at the headline "
                      f"`k`): `max_abs_eta_diff` spans `{lo:.4e}`–`{hi:.4e}` across "
                      f"`p = {p_lo}`–`{p_hi}`. The gap does not shrink as the basis grows, "
                      "so it is **not a basis-size artefact** — which is what this axis, "
                      "and only this axis, establishes.",
                  ]

          lines += [
              "",
              f"**Offset tripwire** (reported, never gated): `te` "
              f"{r_payload.get('offset_gap_te', float('nan')):.3e}, `anova` "
              f"{r_payload.get('offset_gap_anova', float('nan')):.3e}. `eta` is "
              "`m$linear.predictors`, NOT `predict(type='link')` — the latter excludes "
              "an offset supplied through `gam()`'s `offset=` argument, and using it "
              "made `max_abs_eta_diff` read `1.9751` on this recipe against a `2e-2` "
              "bound, a spurious failure that was entirely `max(log(exposure*q_base))`.",
              "",
              "Coefficients are NOT compared (PLAN Anchor 2). The amount basis "
              "(quasi-Poisson — blocker B) and the parametric factor block are out of "
              "scope and are NOT measured by anything above.",
          ]

          report = "\n".join(lines) + "\n"
          with open("gam_production_mi_probe_report.md", "w") as fh:
              fh.write(report)
          print(report)
          PY
          if [ -f gam_production_mi_probe_report.md ]; then
            cat gam_production_mi_probe_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

