# =============================================================================
# Polaris RE — mgcv conformance run
# =============================================================================
# The R half of slice 5, executed. `docs/RUNBOOK_mgcv_conformance.md` describes
# two maintainer commands; this runs the second and third of them against the
# committed synthetic exchange, so `tr(F)`, the Kass-Steffey covariance and
# Wood's `gamma` can move from *adopted* to *verified or refuted* (PLAN Anchor 8)
# without anyone installing R.
#
# ADR-151 / Anchor 5 keep R out of the pytest suite, and that still holds: no job
# here runs pytest, and `rscript_mgcv_available()` still returns False everywhere
# CI runs Python. R appears only inside a pinned container, in its own job, on a
# path-filtered trigger — so an ordinary PR that touches none of the conformance
# files never pulls an image and never grows an R dependency.
#
# A DISAGREEMENT IS A RESULT, NOT A BROKEN BUILD — and the gate is built around
# that sentence rather than in tension with it.
#
# The comparator exits 2 whenever ANY level disagrees, so gating on its exit
# status alone would make this workflow permanently red the moment a level is
# refuted. It already is: the 2026-08-10 run verified `tr(F)` (levels 1-3 agree)
# and REFUTED the Kass-Steffey covariance (level 4). Both are results. Only one of
# them should stop a merge.
#
# So the gate is: FAIL on levels 1-3, ANNOTATE on levels 4-5.
#
#   * levels 1-3 are slice 5's acceptance criteria (PLAN slice 5) and they AGREE
#     today. A regression there means our penalized IRLS, our REML search or
#     `tr(F)` stopped matching mgcv — a defect, and it must block.
#   * levels 4-5 are findings under active work (the level-4 under-inflation is a
#     BLOCKER against slice 4's arithmetic, tracked in PRODUCT_DIRECTION). They are
#     surfaced as warnings and in the job summary, and they do not block.
#   * exit 1 — "could not compare at all": a hash mismatch, a missing reference, a
#     partial R run — always blocks. That is not a finding, it is an absent answer.
#
# A LEVEL THAT WAS NOT MEASURED IS TREATED AS A FAILURE, not a pass. Silence is the
# one outcome that must never read as success here: an R run that fitted no fixed-λ
# cells would otherwise report "level 1: not present" and sail through.
# =============================================================================

name: mgcv conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/mgcv_conformance.R"
      - "scripts/compare_mgcv_conformance.py"
      - "scripts/export_mgcv_case.py"
      - "src/polaris_re/analytics/experience_mgcv_conformance.py"
      # The module UNDER test, not just the harness. Without this line a change to
      # the penalized fitter or the Kass-Steffey correction does not run the check
      # that measures it — which is exactly the shape of the level-4 work (ADR-190).
      - "src/polaris_re/analytics/experience_gam_penalized.py"
      # Slice 2's own module under test — a change to the Python cr basis must
      # re-run the Stage-A comparison that measures it against smoothCon(), same
      # reasoning as the line above for the penalized fitter.
      - "src/polaris_re/analytics/gam_basis_cr.py"
      - "src/polaris_re/analytics/gam_stage_a.py"
      - "src/polaris_re/analytics/gam_derivatives.py"
      - "src/polaris_re/analytics/gam_derivatives_conformance.py"
      - "src/polaris_re/analytics/gam_uncertainty.py"
      - "src/polaris_re/analytics/gam_uncertainty_conformance.py"
      - "scripts/gam_vc_probe.R"
      - "scripts/gam_vc_compare.py"
      - "scripts/gam_deriv_probe.R"
      - "scripts/gam_deriv_compare.py"
      - "scripts/gam_term_extract.R"
      # Slice 3's own module and probe — same reasoning as the two lines above.
      - "src/polaris_re/analytics/gam_family.py"
      - "src/polaris_re/analytics/gam_fit.py"
      - "src/polaris_re/analytics/gam_family_conformance.py"
      - "scripts/gam_family_probe.R"
      # Slice 4 part A's own module and probe — the generalized REML score,
      # same reasoning as the family/link lines above: a change here must
      # re-run the comparison that measures it against mgcv.
      - "src/polaris_re/analytics/gam_reml.py"
      - "src/polaris_re/analytics/gam_reml_conformance.py"
      - "scripts/gam_reml_probe.R"
      # Work order: does the SHIPPED tensor-MI REML score
      # (experience_gam_penalized.reml_score) have the same missing
      # penalized-deviance term ADR-196 found and fixed above? Diagnostic-only
      # — same reasoning as the lines above.
      - "src/polaris_re/analytics/gam_reml_production_check.py"
      - "scripts/reml_production_check_probe.py"
      # Slice 4 part B's own module and probe — the continuous outer search,
      # same reasoning as the lines above: a change here must re-run the
      # comparison that measures it against mgcv's own free-sp selection.
      - "src/polaris_re/analytics/gam_reml_optimize.py"
      - "src/polaris_re/analytics/gam_reml_optimize_conformance.py"
      - "scripts/reml_continuous_optimizer_probe.py"
      # Slice 5's remaining scope — the first multi-term mgcv-native model
      # (reference age + MI by-term + ti(age,duration)), same reasoning as the
      # lines above: a change to any of the three basis producers or the
      # multi-term assembly must re-run the Stage-B eta comparison against mgcv.
      - "src/polaris_re/analytics/gam_multiterm_conformance.py"
      - "scripts/gam_multiterm_probe.R"
      # PLAN slice 5b — PolarisGAM from a ModelSpec, and the free-sp
      # conformance case: a change to the shared assembly, the production
      # path, or its probe must re-run the comparison that measures it.
      - "src/polaris_re/analytics/gam_model.py"
      - "src/polaris_re/analytics/gam_model_conformance.py"
      - "scripts/gam_multiterm_free_sp_probe.R"
      - "scripts/gam_multiterm_sp_delta_probe.R"
      - "data/mgcv_exchange/**"
      - ".github/workflows/mgcv-conformance.yml"

permissions:
  contents: read

concurrency:
  group: mgcv-conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  # The levels that BLOCK a merge, as a visible policy rather than a shell condition
  # buried in a step. These are slice 5's acceptance criteria; 4 and 5 are findings
  # under active work. Widening this list is a deliberate, reviewable edit — and
  # NARROWING it to go green is the move the epic has refused twice already.
  REQUIRED_LEVELS: "1,2,3"
  # Digest-pinned, never a tag: the whole suite rests on the reference not moving
  # between runs, and `:latest` would let an mgcv update rewrite the oracle
  # silently. Bumping this is a reviewable commit with a re-run attached.
  # Currently R 4.6.1 / mgcv 1.9.4 / jsonlite 2.0.0 / mboost 2.9.13, CRAN snapshot
  # 2026-08-01 — upstream build 8, the first build with host-independent numerics.
  #
  # A TAG STOPPED IDENTIFYING A BUILD, AND THAT IS THE ARGUMENT FOR THIS LINE.
  # The 2026-08-10 rebuild added `mboost` without moving R, mgcv or the snapshot, and the
  # `r4.6.1-2026-08-01` tag was moved onto it. That tag *looks* like it encodes everything
  # relevant — R version and snapshot date — and it no longer did: anyone pinning it
  # silently picked up a package that was not there before. Nothing broke, because the
  # addition was additive and this workflow pins the digest. But the tag was a reasonable
  # thing to trust, and it was wrong. Digest, always.
  #
  # RESOLVED UPSTREAM (R-Gam-base PR #3, 2026-08-11): tags are now immutable and never
  # reused, named `r<R>-cran<snapshot>-b<NN>`, with the build number carrying the
  # distinction when the version fields cannot. `BUILDS.md` in that repo is the catalog,
  # keyed on digest. `r4.6.1-2026-08-01` is DEPRECATED rather than deleted — GHCR has no
  # per-tag delete, and that tag sits on the digest below, so removing it would have meant
  # deleting a package version this workflow pins. Demotion was the right call.
  #
  # THE THREE BUILDS THIS FILE HAS PINNED:
  #   build 1  sha256:a77a61cf2319…ce8e  2026-08-09  no mboost   ← pinned 0c149e3..105996e
  #   build 2  sha256:8853bf2b6009…b7c   2026-08-11  mboost      ← pinned f16432c..fb3d31e
  #   build 8  sha256:0d54c192e23c…0fd8  2026-08-11  determinism ← pinned from here
  # ADR-189 amendment 1's numbers — `tr(F)` at 7.2e-13 and the level-4 refutation — were
  # produced on BUILD 1. Each bump was verified by re-running this workflow, never assumed.
  # Upstream asserts the locked set byte-identical across all three (mgcv 1.9.4, Matrix
  # 1.7.5, nlme 3.1.169, jsonlite 2.0.0, digest 0.6.39) — which covers Matrix and nlme, the
  # place an `mboost` dependency could have moved mgcv's numerics with its own version
  # unchanged.
  #
  # WHY BUILD 8, AND THE REASON IS NOT `mboost`. Upstream found that builds 1-7 were NOT
  # host-independent: OpenBLAS sized its thread pool from the runner's core count, and the
  # differing reduction order moved the last bits — two stable outputs, roughly 50/50, with
  # every package version identical. Build 8 pins `OPENBLAS_NUM_THREADS=1`, and upstream CI
  # now diffs each build's reference-output hashes against the previous build's so it cannot
  # recur silently.
  #
  # That defect could not have flipped a verdict here: the tightest committed tolerance is
  # 1e-09 on `max_abs_eta_diff` against 2.9e-14 observed, and a last-bit reduction
  # difference is ~1e-16 relative. But this file is about to be used for something stricter.
  # PLAN_mgcv_parity_engine.md Anchor 1 compares design matrices term by term, and measured
  # `lpmatrix` fidelity at 3.553e-15 — the same order as the nondeterminism. On builds 1-7 a
  # Stage-A disagreement at that scale could be the runner's core count rather than our
  # basis, which is exactly the attribution the two-stage strategy exists to make possible.
  # Determinism is a prerequisite for slice 1, not a nicety.
  #
  # The metric to watch across this bump is level 2's `max_abs_log10_sp_diff`: 4.3221e-01
  # observed against a 5.0e-01 tolerance, the only committed metric without an order of
  # magnitude of headroom. Smoothing-parameter selection is an optimisation, so last-bit
  # input noise can move a selected lambda by much more than last-bit.
  #
  # mboost is present for the maintainer's exploratory `gamboost` work. It is NOT a parity
  # target (docs/PLAN_mgcv_parity_engine.md §1: componentwise boosting is a different
  # algorithm with no likelihood covariance), and nothing in this workflow uses it — so if
  # a future rebuild drops it, this suite is unaffected.
  ORACLE_IMAGE: ghcr.io/jonathancrawford05/r-gam-base@sha256:0d54c192e23c62bdc614eb5b534e04482f6cf92290e76cacb7956022cd806fd8

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: the R side — fit every cell, emit one reference JSON
  # ---------------------------------------------------------------------------
  mgcv-reference:
    name: mgcv reference (R)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # `docker run` rather than a job-level `container:`. The oracle image is
      # built from rocker/r-ver, which ships no git, so actions/checkout inside it
      # would fall back to a REST tarball download. Checking out on the host and
      # mounting the workspace keeps the image a pure R runtime with nothing in it
      # to satisfy Actions.
      - name: Fit every cell with mgcv
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work "$ORACLE_IMAGE" \
            Rscript scripts/mgcv_conformance.R \
              data/mgcv_exchange/synthetic \
              mgcv_reference.json

      - name: Record the R environment that produced it
        run: |
          {
            echo "## mgcv reference"
            echo
            echo "- image \`$ORACLE_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("mgcv_reference.json"))
          for k in ("r_version", "mgcv_version", "jsonlite_version",
                    "scale_penalty", "exchange_sha256"):
              print(f"- `{k}`: `{d.get(k)}`")
          print(f"- cells fitted: **{len(d.get('cells', {}))}**")
          PY

      # ADR-190's decisive measurement, on the authoritative oracle. DIAGNOSTIC ONLY —
      # it asserts nothing and cannot fail the build; the comparison job is what gates.
      # It exists so ADR-190's central claim carries a TIER 3 label rather than an
      # argument for why tier 1 was good enough (PR #195 review, [P0]).
      - name: Probe whether Vc equals Vb + J V_rho J' (ADR-190)
        # THE LINE THAT MAKES THE "DIAGNOSTIC ONLY" CLAIM TRUE RATHER THAN INTENDED.
        # Without it the claim was prose in three places and an assertion in none: the step
        # runs `set -euo pipefail`, the R script has four `stop()` paths, and `compare`
        # declares `needs: mgcv-reference` — so a renamed `outer.info$hess` in some future
        # mgcv, or a manifest with no free-sp gamma=1 cell, would redden the levels 1-3
        # gate. That inverts this file's own policy by letting a level-4 diagnostic block a
        # merge. PR #195 review [P1], and the same shape as the finding the probe measures.
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work "$ORACLE_IMAGE" \
            Rscript scripts/ks_formula_probe.R \
              data/mgcv_exchange/synthetic \
              ks_formula_probe.json
          {
            echo
            echo "### ADR-190 — is \`Vc\` equal to \`Vb + J V_rho Jᵀ\`?"
            echo
            echo "| cell | \`mean diag(Vc-Vp)\` | \`mean diag(J V_rho Jᵀ)\` | ratio | inflation from formula | mgcv reports |"
            echo "|---|---:|---:|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("ks_formula_probe.json"))
          for name, c in d["cells"].items():
              print(
                  f"| `{name}` | {c['mean_diag_vc_minus_vp']:.5e} | "
                  f"{c['mean_diag_j_vrho_jt']:.5e} | "
                  f"{c['ratio_actual_over_formula']:.4f} | "
                  f"{c['inflation_from_formula']:.4f} | "
                  f"**{c['inflation_reported']:.4f}** |"
              )
          print()
          print("A ratio far from 1.0 means the formula, not the arithmetic, is the gap.")
          PY

      # PLAN_mgcv_parity_engine.md slice 1's one named risk, on the authoritative oracle.
      # DIAGNOSTIC ONLY, same contract as the ADR-190 probe above: it has `stop()` paths
      # and can exit non-zero, and `continue-on-error: true` is what stops that from
      # blocking a merge. No exchange dependency — it builds its own tiny `bs="cr"` case,
      # so it runs even before slice 2 ships a real cr basis.
      - name: Probe whether smoothCon(absorb.cons=TRUE) reproduces lpmatrix (slice 1)
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work "$ORACLE_IMAGE" \
            Rscript scripts/smoothcon_lpmatrix_probe.R \
              smoothcon_lpmatrix_probe.json
          {
            echo
            echo "### Slice 1 — does \`smoothCon(absorb.cons=TRUE)\$X\` equal \`lpmatrix\`'s smooth block?"
            echo
            echo "| case | dim | rank | max|lpmatrix - smoothCon X| | max|S diff| |"
            echo "|---|---|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("smoothcon_lpmatrix_probe.json"))
          for name, c in d["cases"].items():
              dim = "x".join(str(v) for v in c["dim_x"])
              print(
                  f"| `{name}` | {dim} | {c['rank']} | "
                  f"{c['max_abs_diff_lpmatrix_vs_smoothcon_x']:.3e} | "
                  f"{c['max_abs_diff_gam_smooth_S_vs_smoothcon_S']:.3e} |"
              )
          print()
          print("Zero (to the printed precision) means the two Stage-A referents PLAN §5 "
                "risk 1 worried about are the same object, not two competing choices.")
          PY

      # Slice 1's remaining scope (docs/CONTINUATION_mgcv_parity_engine.md): the
      # R-side per-term extractor, proven here on the "raw"/paraPen basis before
      # either side trusts it on a new one (Anchor 1). DIAGNOSTIC ONLY, same
      # contract as the two probes above — the per-term JSON is compared against
      # the Python side in the `compare` job below, not gated here.
      - name: Extract per-term Stage-A artefacts from the raw/paraPen basis (slice 1)
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work "$ORACLE_IMAGE" \
            Rscript scripts/gam_term_extract.R \
              data/mgcv_exchange/synthetic \
              gam_term_extract.json

      # PLAN_mgcv_parity_engine.md slice 3: a SHARED (X, S) design fitted under
      # four family/link/weight combinations (binomial logit/cloglog with prior
      # weights, quasi-Poisson, Poisson with a log offset), at fixed sp. Same
      # DIAGNOSTIC contract as the probes above — the eta/dispersion comparison
      # against the independent Python IRLS (gam_fit.penalized_irls_general)
      # happens in the `compare` job below, not gated here.
      - name: Fit the shared family/link design under four combinations (slice 3)
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work "$ORACLE_IMAGE" \
            Rscript scripts/gam_family_probe.R \
              gam_family_probe.json

      # PLAN_mgcv_parity_engine.md slice 4 part A: a SHARED (X, S1, S2, y,
      # weights) binomial/logit design with two independently-scaled penalty
      # blocks, fitted at three fixed (sp1, sp2) points via paraPen with
      # method="REML" so gcv.ubre reports the REML criterion at each point
      # (no optimisation runs). Same DIAGNOSTIC contract as the probes above
      # — the comparison against the independent Python score
      # (gam_reml.reml_score_general) happens in the `compare` job below.
      - name: Fit the shared two-block binomial design at fixed sp (slice 4 part A)
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work "$ORACLE_IMAGE" \
            Rscript scripts/gam_reml_probe.R \
              gam_reml_probe.json

      # Wood (2011) derivatives (docs/WORK_ORDER_dw_drho_wood2011.md). Refits at
      # rho +/- h so the Python side can central-difference mgcv's OWN eta and
      # working weights — the INDEPENDENT reference operand for d(eta)/d(rho)
      # and dw/d(rho). Same DIAGNOSTIC contract as the probes above.
      - name: Fit at perturbed sp for the Wood (2011) derivatives
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work "$ORACLE_IMAGE" \
            Rscript scripts/gam_deriv_probe.R \
              gam_deriv_probe.json

      # Level 4: mgcv's own Vb and Vc at its own free-sp selection, plus the outer
      # Hessian, so the Python side can assemble eq. (7) and compare element-wise.
      - name: Fit free-sp and export Vc for the level-4 comparison
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work "$ORACLE_IMAGE" \
            Rscript scripts/gam_vc_probe.R \
              gam_vc_probe.json

      # Slice 5's remaining scope (docs/CONTINUATION_mgcv_parity_engine.md): the
      # first multi-term mgcv-native model — reference age smooth, the MI
      # by-term, and ti(AttdAge, PolYear), fit TOGETHER at a fixed sp for every
      # block. Same DIAGNOSTIC contract as the probes above — the eta comparison
      # against the independent Python assembly (gam_multiterm_conformance)
      # happens in the `compare` job below, not gated here.
      - name: Fit the shared three-term multi-term design at fixed sp (slice 5)
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work "$ORACLE_IMAGE" \
            Rscript scripts/gam_multiterm_probe.R \
              gam_multiterm_probe.json

      # PLAN slice 5b (docs/WORK_ORDER_multi_term_assembly.md): the SAME
      # three-term formula at FREE sp — mgcv chooses its own smoothing
      # parameters via method="REML". Same DIAGNOSTIC contract as the probes
      # above; the comparison against PolarisGAM's own selection happens in
      # the `compare` job below.
      - name: Fit the shared three-term multi-term design at free sp (slice 5b)
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work "$ORACLE_IMAGE" \
            Rscript scripts/gam_multiterm_free_sp_probe.R \
              gam_multiterm_free_sp_probe.json

      # PR #212 review [P1] / ADR-208 amendment: does mgcv's OWN REML score
      # rank mgcv's own free-sp point vs Python's own selected point the same
      # way our (already-verified) criterion does? DIAGNOSTIC ONLY — reads
      # mgcv's own score at a point Python selected, so this can never be part
      # of the committed INDEPENDENT comparator (same reasoning as
      # gam_deriv_probe.R / gam_vc_probe.R). Python's own log10(sp) below is
      # the TIER-1 reading from this same slice's original measurement
      # (docs/CONFORMANCE_LEDGER.md, 2026-08-25) — hand-supplied, not
      # recomputed here, because the two-job CI split has no path for a
      # third R stage to consume job 2's own output.
      - name: Does mgcv's own score rank the two free-sp points the same way ours does? (PR #212 [P1])
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work "$ORACLE_IMAGE" \
            Rscript scripts/gam_multiterm_sp_delta_probe.R \
              6.75256951 9.09550509 3.09851263 3.05446081 \
              gam_multiterm_sp_delta_probe.json
          if [ -f gam_multiterm_sp_delta_probe.json ]; then
            {
              echo ""
              echo "### PR #212 [P1] — mgcv's own score at both free-sp points (diagnostic, not part of FREE_SP_MODEL_CLAIM)"
              echo ""
              cat gam_multiterm_sp_delta_probe.json
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # PLAN slice 5c sequencing step 1: the tier-3 baseline for the
      # fixed-sp criterion spread — the discriminating measurement behind
      # Defects A (log|S|+) and B (the observed-Hessian weight). DIAGNOSTIC
      # ONLY: reads mgcv's own gcv.ubre at fixed sp, same status as the
      # free-sp delta probe above. Eight points, same shared design as
      # gam_multiterm_free_sp_probe.R / gam_multiterm_sp_delta_probe.R (same
      # seed, same n, same knots).
      - name: Fixed-sp REML score at 8 points, spanning up to a 6.8-decade lambda spread (slice 5c)
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work "$ORACLE_IMAGE" \
            Rscript scripts/gam_fixed_sp_score_probe.R \
              gam_fixed_sp_score_probe.json

      - uses: actions/upload-artifact@v4
        with:
          name: mgcv-reference
          path: |
            mgcv_reference.json
            ks_formula_probe.json
            smoothcon_lpmatrix_probe.json
            gam_term_extract.json
            gam_family_probe.json
            gam_reml_probe.json
            gam_deriv_probe.json
            gam_vc_probe.json
            gam_multiterm_probe.json
            gam_multiterm_free_sp_probe.json
            gam_multiterm_sp_delta_probe.json
            gam_fixed_sp_score_probe.json

  # ---------------------------------------------------------------------------
  # Job 2: the comparison — Python, no R
  # ---------------------------------------------------------------------------
  compare:
    name: Compare against the Python reference
    runs-on: ubuntu-latest
    needs: mgcv-reference
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - uses: actions/download-artifact@v4
        with:
          name: mgcv-reference
          path: .

      # The comparator re-hashes the exchange before it reads either reference, so
      # a mismatch between what R fitted and what is committed stops here.
      #
      # Its exit status is captured rather than gated on: 0 = every level agrees,
      # 2 = some level disagrees, 1 = could not compare. Only 1 is a defect on its
      # own; 2 needs the per-level verdicts to decide, which is the next step.
      - name: Compare the two references
        id: compare
        run: |
          set -uo pipefail
          rc=0
          uv run python scripts/compare_mgcv_conformance.py \
            --exchange data/mgcv_exchange/synthetic \
            --mgcv-reference mgcv_reference.json \
            --markdown mgcv_conformance_report.md \
            --output mgcv_conformance.json || rc=$?
          echo "comparator exit status: $rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error title=Conformance could not be compared::The comparator" \
                 "exited $rc — it did not produce a verdict. Expected 0 (all levels" \
                 "agree) or 2 (some level disagrees). Exit 1 means the comparison was" \
                 "refused: a hash mismatch, a missing reference, or a partial R run." \
                 "See the step log; an absent answer is not a finding."
            exit 1
          fi

      # THE GATE. Fails on REQUIRED_LEVELS, annotates on the rest — see the header.
      # Separate from the step above so the failure message names the level rather
      # than an exit code, and so the report is published either way.
      - name: Gate on levels 1-3, annotate levels 4-5
        run: |
          python3 - <<'PY'
          import json, os, sys

          required = {int(x) for x in os.environ["REQUIRED_LEVELS"].split(",") if x.strip()}
          try:
              data = json.load(open("mgcv_conformance.json"))
          except (OSError, json.JSONDecodeError) as exc:
              print(f"::error title=No comparison JSON::{exc}")
              sys.exit(1)

          settled = {int(k): bool(v) for k, v in data.get("levels_settled", {}).items()}
          lines = ["", "## Gate", "", "| level | verdict | blocking |", "|---|---|---|"]
          failed = []

          # Absence is a failure, not a pass: a run that fitted no fixed-lambda cells
          # would report level 1 as simply missing.
          for level in sorted(required):
              if level not in settled:
                  failed.append(f"level {level} was NOT MEASURED")
                  lines.append(f"| {level} | **NOT MEASURED** | yes |")
              elif not settled[level]:
                  failed.append(f"level {level} DISAGREES")
                  lines.append(f"| {level} | **DISAGREES** | yes |")
              else:
                  lines.append(f"| {level} | agrees | yes |")

          for level in sorted(set(settled) - required):
              verdict = "agrees" if settled[level] else "**DISAGREES** (finding)"
              lines.append(f"| {level} | {verdict} | no |")
              if not settled[level]:
                  print(
                      f"::warning title=Level {level} disagrees::A finding, not a defect. "
                      f"Levels 4-5 are not slice-5 acceptance criteria and do not block. "
                      f"Level 4's under-inflation is tracked as a BLOCKER against slice 4's "
                      f"Kass-Steffey arithmetic in PRODUCT_DIRECTION."
                  )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")

          if failed:
              print(
                  "::error title=Conformance regression on a required level::"
                  + "; ".join(failed)
                  + f". Levels {sorted(required)} are slice 5's acceptance criteria and "
                  "agreed as of 2026-08-10 — a change here means our penalized IRLS, our "
                  "REML search or tr(F) stopped matching mgcv. Do NOT widen a tolerance "
                  "to clear this."
              )
              sys.exit(1)
          print(f"Required levels {sorted(required)} all agree.")
          PY

      # Runs even when the comparison fails: on a disagreement the table IS the
      # deliverable, and burying it in a red step defeats the purpose of the run.
      - name: Publish the report
        if: always()
        run: |
          if [ -f mgcv_conformance_report.md ]; then
            cat mgcv_conformance_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The comparator produced no report — see the step log." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # Slice 1's remaining scope, the Python half: compare gam_term_extract.json
      # (job 1) against extract_raw_terms() term by term. DIAGNOSTIC ONLY, same
      # contract as the R-side probes — asserts nothing that fails this job, prints
      # the verdict to the job summary. The pytest end-to-end test
      # (test_the_r_extractor_agrees_with_the_python_side_on_every_design) is the
      # gating version of this same check, wherever R happens to be installed
      # (ADR-151's own gate keeps it out of ordinary CI).
      #
      # Slice 1b adds the same treatment for smooth_designs (mgcv-native, via
      # extract_smooth_terms) — same DIAGNOSTIC contract, same job-summary table
      # shape, plus the knots column slice 1b makes meaningful.
      - name: Compare the per-term extraction against the Python side (slice 1 / 1b / 2)
        if: always()
        continue-on-error: true
        run: |
          uv run python3 - <<'PY'
          import json
          import sys

          try:
              r_payload = json.load(open("gam_term_extract.json"))
          except (OSError, json.JSONDecodeError) as exc:
              print(f"No gam_term_extract.json to compare ({exc}) — the R probe above "
                    "did not produce one.")
              sys.exit(0)

          import numpy as np

          from polaris_re.analytics.experience_mgcv_conformance import (
              DESIGNS, build_design, synthetic_cells,
          )
          from polaris_re.analytics.gam_stage_a import (
              CR_BASIS_CLAIM, CR_BY_BASIS_CLAIM, RAW_PATH_CLAIM, SMOOTH_PATH_CLAIM,
              TI_BASIS_CLAIM, build_python_cr_term, build_python_ti_term,
              compare_term_extract, extract_raw_terms, extract_smooth_terms,
              raw_term_specs,
          )
          from polaris_re.analytics.gam_term_spec import TermSpec
          from polaris_re.core.verification import evidence_markdown

          by_id = {d.design_id: d for d in DESIGNS}
          cases = [
              ("d1", raw_term_specs(with_factor=False), False),
              ("d2", raw_term_specs(with_factor=True, factor_label="sex"), True),
              ("d3", raw_term_specs(with_factor=False), False),
          ]

          # ADR-193: the provenance legend prints BEFORE the diffs, and its headline is
          # derived from the declared claim rather than written here — so a column of
          # zeros cannot be read as parity unless it is parity.
          lines = [
              "", "### Slice 1 — per-term Stage-A extraction (raw/paraPen basis)", "",
              evidence_markdown(RAW_PATH_CLAIM), "",
              "| design | term | index range agrees | max abs X diff | max abs S diff | rank diff |",
              "|---|---|---|---:|---:|---:|",
          ]
          any_disagree = False
          for design_id, terms, with_factor in cases:
              export = build_design(by_id[design_id], synthetic_cells(with_factor=with_factor))
              python_terms = extract_raw_terms(terms, export)
              r_terms = r_payload.get("designs", {}).get(design_id, {}).get("terms", {})
              for label, python_term in python_terms.items():
                  if label not in r_terms:
                      lines.append(f"| `{design_id}` | `{label}` | **MISSING FROM R OUTPUT** | | | |")
                      any_disagree = True
                      continue
                  c = compare_term_extract(python_term, r_terms[label])
                  if not c.agrees:
                      any_disagree = True
                  s_diff = ", ".join(f"{d:.3e}" for d in c.max_abs_s_diff) or "n/a"
                  lines.append(
                      f"| `{design_id}` | `{label}` | {c.index_range_agrees} | "
                      f"{c.max_abs_design_diff:.3e} | {s_diff} | {c.rank_diff} |"
                  )
          lines.append("")
          lines.append(
              "Zero diffs mean the harness reads mgcv's fitted paraPen object correctly "
              "and that mgcv did not reparameterise the design and penalties it was "
              "handed. Per the legend above, `design_X` and `penalty_S` are ECHO columns "
              "— Python supplied them — so they are a no-tampering check, not basis "
              "parity; `rank` is the one independently produced column here."
          )
          if any_disagree:
              lines.insert(1, "**A term disagreed — see the table.**")

          smooth_r_terms = r_payload.get("smooth_designs", {})
          smooth_lines = [
              "", "### Slice 1b — per-term Stage-A extraction (mgcv-native, smoothCon)", "",
              evidence_markdown(SMOOTH_PATH_CLAIM), "",
              "| term | index range agrees | max abs X diff | max abs S diff | rank diff | knots agree |",
              "|---|---|---:|---:|---:|---|",
          ]
          any_smooth_disagree = False
          # Single-variable cr cases only (knots is a list); the ti cases (slice 5)
          # carry knots=None (each margin has its own, module docstring) and are
          # this same TRANSPORT check's own section further below.
          single_var_smooth_terms = {
              label: r_term for label, r_term in smooth_r_terms.items()
              if r_term.get("knots") is not None
          }
          if single_var_smooth_terms:
              smooth_terms = tuple(
                  TermSpec(label=label, variables=("x",), basis="cr", k=(len(r_term["knots"]),))
                  for label, r_term in single_var_smooth_terms.items()
              )
              python_smooth_terms = extract_smooth_terms(smooth_terms, single_var_smooth_terms)
              for label, python_term in python_smooth_terms.items():
                  c = compare_term_extract(python_term, smooth_r_terms[label])
                  if not c.agrees:
                      any_smooth_disagree = True
                  s_diff = ", ".join(f"{d:.3e}" for d in c.max_abs_s_diff) or "n/a"
                  smooth_lines.append(
                      f"| `{label}` | {c.index_range_agrees} | "
                      f"{c.max_abs_design_diff:.3e} | {s_diff} | {c.rank_diff} | {c.knots_agree} |"
                  )
          else:
              smooth_lines.append("| *(no smooth_designs in R output)* | | | | | |")
              any_smooth_disagree = True
          smooth_lines.append("")
          smooth_lines.append(
              "Every column here is TRANSPORT (see the legend): `extract_smooth_terms` "
              "reads the R payload and is then compared against that same payload, so "
              "these diffs are structurally zero and CANNOT indicate basis agreement — "
              "a disagreement means the packaging or the JSON round trip broke. The "
              "check that carries weight on this path is the R extractor's own internal "
              "guard against `predict(type=\"lpmatrix\")` / `m$smooth[[j]]` (ADR-191), "
              "which `stop()`s the R script before it emits anything. Slice 2 replaces "
              "the left producer with a Python `cr` basis, making these columns "
              "INDEPENDENT — the first real Stage-A parity measurement."
          )
          if any_smooth_disagree:
              smooth_lines.insert(2, "**A term disagreed — see the table.**")
          lines += smooth_lines

          # Slice 2 — the epic's first INDEPENDENT Stage-A comparison (ADR-193): a
          # Python cr basis (build_python_cr_term, gam_basis_cr.py) built purely
          # from the covariate locations and a knot recipe, checked against the
          # SAME smooth_designs payload slice 1b already reads — but as the
          # reference side of a real computation this time, not the thing being
          # parsed. The (k, knots) recipe per case is named here rather than
          # inferred from the R payload (Anchor 4: never derive knots when
          # supplied; a k mismatch read off the payload could never surface as a
          # disagreement — PR #201 review [P2]).
          smooth_cases = {
              "default-knots-k8": (8, None, False),
              "default-knots-k13": (13, None, False),
              "supplied-knots-k8": (8, (0.0, 1.0, 2.0, 3.0, 5.0, 8.0, 9.0, 10.0), False),
              # PLAN §1's actual target formula's own knot vectors.
              "target-attdage-k13": (13, (1.0, 2.0, 4.0, 7.0, 14.0, 18.0, 24.0, 35.0, 50.0,
                                           70.0, 85.0, 90.0, 95.0), False),
              "target-polyear-k6": (6, (1.0, 2.0, 3.0, 5.0, 10.0, 21.0), False),
              # Slice 5, the MI term's own basis: s(AttdAge, by=StudyYear_C, k=13,
              # bs="cr") — same target AttdAge knots, numeric by variable.
              "mi-term-attdage-by-k13": (13, (1.0, 2.0, 4.0, 7.0, 14.0, 18.0, 24.0, 35.0, 50.0,
                                               70.0, 85.0, 90.0, 95.0), True),
          }
          # Two claims, two tables (PR #206 review [P1]): the no-by and numeric-by
          # constructions have genuinely different producers on BOTH sides, and
          # evidence_markdown's legend is published verbatim above whatever rows
          # follow it. One shared legend would name absorb_sum_to_zero_constraint
          # above a row whose branch never runs it.
          _HEADER = (
              "| term | index range agrees | max abs X diff | max abs S diff |"
              " rank diff | knots agree (recipe check, not parity) |"
          )
          _RULE = "|---|---|---:|---:|---:|---|"
          cr_lines = [
              "", "### Slice 2 — Python `cr` basis vs `smoothCon()` (INDEPENDENT)", "",
              evidence_markdown(CR_BASIS_CLAIM), "",
              _HEADER, _RULE,
          ]
          by_lines = [
              "", "### Slice 5 — Python numeric-`by` `cr` basis vs `smoothCon(by=)` (INDEPENDENT)", "",
              evidence_markdown(CR_BY_BASIS_CLAIM), "",
              _HEADER, _RULE,
          ]
          any_cr_disagree = False
          if single_var_smooth_terms:
              for label, r_term in single_var_smooth_terms.items():
                  if label not in smooth_cases:
                      cr_lines.append(f"| `{label}` | **UNKNOWN CASE — no knot recipe named** | | | | |")
                      any_cr_disagree = True
                      continue
                  k, supplied, with_by = smooth_cases[label]
                  term = TermSpec(
                      label=label, variables=("x",), basis="cr",
                      k=(k,),
                      knots=(("x", supplied),) if supplied is not None else None,
                      by="z" if with_by else None,
                  )
                  x = np.asarray(r_term["x"], dtype=np.float64)
                  by = np.asarray(r_term["by"], dtype=np.float64) if with_by else None
                  python_term = build_python_cr_term(x, term, by=by)
                  c = compare_term_extract(python_term, r_term)
                  if not c.agrees:
                      any_cr_disagree = True
                  s_diff = ", ".join(f"{d:.3e}" for d in c.max_abs_s_diff) or "n/a"
                  row = (
                      f"| `{label}` | {c.index_range_agrees} | "
                      f"{c.max_abs_design_diff:.3e} | {s_diff} | {c.rank_diff} | {c.knots_agree} |"
                  )
                  (by_lines if with_by else cr_lines).append(row)
          else:
              cr_lines.append("| *(no smooth_designs in R output)* | | | | | |")
              by_lines.append("| *(no smooth_designs in R output)* | | | | | |")
              any_cr_disagree = True
          cr_lines.append("")
          cr_lines.append(
              "`design_X`, `penalty_S` and `rank` are INDEPENDENT (see the legend): "
              "the Python `cr` basis is built from Wood's natural-cubic-spline "
              "definition and never reads mgcv's X/S/rank/knots, only the shared "
              "covariate `x`. A disagreement on those three is a REAL RESULT about "
              "the basis, not a broken round trip. `knots agree` is a separate "
              "recipe-consistency check, NOT a parity column (PR #201 review "
              "[P1]): it is independently computed only in the default-knot cases "
              "(each side's own quantile placement) — in the supplied-knot cases "
              "neither side computes it, both relay the same hand-declared literal, "
              "which is ECHO, not INDEPENDENT — so it is excluded from "
              "CR_BASIS_CLAIM rather than mislabelled. See "
              "docs/PLAN_mgcv_parity_engine.md slice 2 and "
              "docs/VERIFICATION_STANDARD.md."
          )
          by_lines.append("")
          by_lines.append(
              "Same three INDEPENDENT quantities as slice 2's table above, but a "
              "DIFFERENT construction on both sides, which is why it carries its own "
              "claim (PR #206 review [P1]): the Python side row-scales the "
              "UNCONSTRAINED basis via `by_scale_design` and never calls "
              "`absorb_sum_to_zero_constraint`, and the mgcv side is "
              "`smoothCon(s(x, by=z, ...))`. mgcv absorbs no identifiability "
              "constraint on a numeric-by smooth (ADR-200, measured — its `$C` has "
              "zero rows), so this term keeps all `k` columns where every no-by "
              "case above drops to `k-1`. `knots agree` is the same "
              "recipe-consistency check, not a parity column. See "
              "docs/PLAN_mgcv_parity_engine.md slice 5 and docs/DECISIONS.md ADR-200."
          )
          if any_cr_disagree:
              cr_lines.insert(2, "**A term disagreed — see the table. This is a genuine finding.**")
          lines += cr_lines
          lines += by_lines

          # Slice 5's second INDEPENDENT Stage-A result: the two-margin ti(x1, x2,
          # bs="cr") tensor interaction (build_python_ti_term, gam_basis_cr.ti_basis)
          # — row-wise Kronecker of two constrained cr margins, normalized once per
          # margin and once at the tensor level (module docstring) — checked against
          # the SAME smooth_designs payload, keyed on the presence of x1/x2 rather
          # than a single x (a two-margin term has no single covariate or knots list).
          ti_smooth_terms = {
              label: r_term for label, r_term in smooth_r_terms.items()
              if r_term.get("x1") is not None
          }
          ti_cases = {
              "ti-default-knots-k6-k5": (6, 5, None, None),
              "ti-target-attdage-polyear": (
                  13, 6,
                  (1.0, 2.0, 4.0, 7.0, 14.0, 18.0, 24.0, 35.0, 50.0, 70.0, 85.0, 90.0, 95.0),
                  (1.0, 2.0, 3.0, 5.0, 10.0, 21.0),
              ),
          }
          ti_lines = [
              "", "### Slice 5 — Python `ti` basis vs `smoothCon(ti(...))` (INDEPENDENT)", "",
              evidence_markdown(TI_BASIS_CLAIM), "",
              "| term | index range agrees | max abs X diff | max abs S diff | rank diff |",
              "|---|---|---:|---:|---:|",
          ]
          any_ti_disagree = False
          if ti_smooth_terms:
              for label, r_term in ti_smooth_terms.items():
                  if label not in ti_cases:
                      ti_lines.append(f"| `{label}` | **UNKNOWN CASE — no knot recipe named** | | | |")
                      any_ti_disagree = True
                      continue
                  k1, k2, supplied1, supplied2 = ti_cases[label]
                  knots = []
                  if supplied1 is not None:
                      knots.append(("v1", supplied1))
                  if supplied2 is not None:
                      knots.append(("v2", supplied2))
                  term = TermSpec(
                      label=label, variables=("v1", "v2"), basis="ti",
                      k=(k1, k2), knots=tuple(knots) if knots else None,
                  )
                  x1 = np.asarray(r_term["x1"], dtype=np.float64)
                  x2 = np.asarray(r_term["x2"], dtype=np.float64)
                  python_term = build_python_ti_term(x1, x2, term)
                  c = compare_term_extract(python_term, r_term)
                  if not c.agrees:
                      any_ti_disagree = True
                  s_diff = ", ".join(f"{d:.3e}" for d in c.max_abs_s_diff) or "n/a"
                  ti_lines.append(
                      f"| `{label}` | {c.index_range_agrees} | "
                      f"{c.max_abs_design_diff:.3e} | {s_diff} | {c.rank_diff} |"
                  )
          else:
              ti_lines.append("| *(no ti cases in R output)* | | | | |")
              any_ti_disagree = True
          ti_lines.append("")
          ti_lines.append(
              "`design_X`, both `penalty_S` blocks and both `rank` values are "
              "INDEPENDENT (see the legend): the Python `ti` basis is built from "
              "each margin's covariate locations and knot vector via "
              "`gam_basis_cr.ti_basis` and never reads mgcv's X/S/rank, only the "
              "shared `x1`/`x2` (and `knots1`/`knots2` for the recipe, not compared "
              "here — see gam_basis_cr.py's module docstring). A disagreement is a "
              "REAL RESULT about the tensor construction, not a broken round trip. "
              "See docs/PLAN_mgcv_parity_engine.md slice 5."
          )
          if any_ti_disagree:
              ti_lines.insert(2, "**A term disagreed — see the table. This is a genuine finding.**")
          lines += ti_lines

          report = "\n".join(lines) + "\n"
          with open("gam_term_extract_report.md", "w") as fh:
              fh.write(report)
          # Also to stdout, not just the job-summary file: the job-summary artifact
          # sits behind a blob-storage host this environment's egress policy has
          # blocked before (docs/CONFORMANCE_LEDGER.md's slice-1b row), but stdout
          # is plain job-log text, readable through the ordinary jobs/logs API.
          # Printing the SAME string as the summary means a future tier-3 read never
          # has to settle for "the step didn't except" again.
          print(report)
          PY
          if [ -f gam_term_extract_report.md ]; then
            cat gam_term_extract_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Slice 3 (docs/PLAN_mgcv_parity_engine.md): compares the independent
      # Python IRLS (gam_fit.penalized_irls_general) against job 1's mgcv fits
      # on the SAME shared design/penalty/response/weights/offset at fixed sp.
      # DIAGNOSTIC ONLY, same contract as the probes above — printed to stdout,
      # not gated here, so a future tier-3 read never has to settle for "the
      # step didn't except" (the lesson slice 2's methodology fix drew from
      # slice 1b's masked continue-on-error conclusion).
      - name: Compare the family/link Stage-B fits against the Python side (slice 3)
        if: always()
        continue-on-error: true
        run: |
          uv run python3 - <<'PY'
          import json
          import sys

          try:
              r_payload = json.load(open("gam_family_probe.json"))
          except (OSError, json.JSONDecodeError) as exc:
              print(f"No gam_family_probe.json to compare ({exc}) — the R probe "
                    "above did not produce one.")
              sys.exit(0)

          import numpy as np

          from polaris_re.analytics.gam_family_conformance import (
              FAMILY_BY_CASE, FAMILY_CLAIM, compare_family_case, fit_family_case,
          )
          from polaris_re.core.verification import evidence_markdown

          x = np.asarray(r_payload["X"], dtype=np.float64)
          s = np.asarray(r_payload["S"], dtype=np.float64)

          lines = [
              "", "### Slice 3 — family/link/weight Stage-B fits vs mgcv (INDEPENDENT on eta)", "",
              evidence_markdown(FAMILY_CLAIM), "",
              "| case | family | link | max abs eta diff | dispersion diff | agrees |",
              "|---|---|---|---:|---:|---|",
          ]
          any_disagree = False
          for case_name in FAMILY_BY_CASE:
              if case_name not in r_payload.get("cases", {}):
                  lines.append(f"| `{case_name}` | | | **MISSING FROM R OUTPUT** | | |")
                  any_disagree = True
                  continue
              r_case = r_payload["cases"][case_name]
              fit = fit_family_case(case_name, x, s, r_case)
              c = compare_family_case(case_name, x, s, fit, r_case)
              if not c["agrees"]:
                  any_disagree = True
              disp = "n/a" if c["dispersion_diff"] is None else f"{c['dispersion_diff']:.3e}"
              lines.append(
                  f"| `{case_name}` | {r_case['family']} | {r_case['link']} | "
                  f"{c['max_abs_eta_diff']:.3e} | {disp} | {c['agrees']} |"
              )
          lines.append("")
          lines.append(
              "`eta` and `dispersion` are INDEPENDENT (see the legend): "
              "gam_fit.penalized_irls_general never reads this script's own eta, "
              "coef or dispersion, only the shared recipe (X, S, y, weights, "
              "offset, sp). A disagreement is a real result about the IRLS/family "
              "arithmetic, not a broken round trip. Coefficients are NOT compared "
              "(Anchor 2 — never a Stage-B acceptance criterion)."
          )
          if any_disagree:
              lines.insert(2, "**A case disagreed — see the table. This is a genuine finding.**")

          report = "\n".join(lines) + "\n"
          with open("gam_family_probe_report.md", "w") as fh:
              fh.write(report)
          print(report)
          PY
          if [ -f gam_family_probe_report.md ]; then
            cat gam_family_probe_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Slice 5's remaining scope: compares the independent Python multi-term
      # assembly (gam_multiterm_conformance) against job 1's native mgcv fit of
      # the SAME three-term formula at the SAME fixed sp. DIAGNOSTIC ONLY, same
      # contract as the probes above — printed to stdout from the start (the
      # methodology fix ADR-194 needed partway through slice 2), so a tier-3
      # read never has to settle for "the step didn't except."
      - name: Compare the multi-term Stage-B fit against the Python side (slice 5)
        if: always()
        continue-on-error: true
        run: |
          uv run python3 - <<'PY'
          import json
          import sys

          try:
              r_payload = json.load(open("gam_multiterm_probe.json"))
          except (OSError, json.JSONDecodeError) as exc:
              print(f"No gam_multiterm_probe.json to compare ({exc}) — the R "
                    "probe above did not produce one.")
              sys.exit(0)

          from polaris_re.analytics.gam_multiterm_conformance import (
              MULTITERM_CLAIM, compare_multiterm_case, fit_multiterm_case,
          )
          from polaris_re.core.verification import evidence_markdown

          fit, _design = fit_multiterm_case(r_payload)
          c = compare_multiterm_case(fit, r_payload)

          lines = [
              "",
              "### Slice 5 (remaining scope) — multi-term mgcv-native model vs mgcv (INDEPENDENT on eta)",
              "",
              evidence_markdown(MULTITERM_CLAIM),
              "",
              "| n | p | max abs eta diff | agrees |",
              "|---:|---:|---:|---|",
              f"| {r_payload['n']} | {len(r_payload['coef'])} | "
              f"{c['max_abs_eta_diff']:.3e} | {c['agrees']} |",
              "",
              "Reference age s(AttdAge), the MI term s(AttdAge,by=StudyYear_C) and "
              "ti(AttdAge,PolYear), fit TOGETHER at a fixed sp under "
              "binomial/cloglog with ExposCnt weights. `eta` is INDEPENDENT (see "
              "the legend): gam_multiterm_conformance.fit_multiterm_case never "
              "reads this script's own eta or coef, only the shared recipe "
              "(AttdAge, PolYear, StudyYear_C, ExposCnt, y, knots, sp). A "
              "disagreement is a real result about the multi-term assembly, not a "
              "broken round trip. Coefficients are NOT compared (Anchor 2).",
          ]
          if not c["agrees"]:
              lines.insert(2, "**Disagreement — see the table. This is a genuine finding.**")

          report = "\n".join(lines) + "\n"
          with open("gam_multiterm_probe_report.md", "w") as fh:
              fh.write(report)
          print(report)
          PY
          if [ -f gam_multiterm_probe_report.md ]; then
            cat gam_multiterm_probe_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # PLAN slice 5b (docs/WORK_ORDER_multi_term_assembly.md): compares
      # PolarisGAM's own free-sp selection (gam_model_conformance) against
      # job 1's native mgcv free-sp REML fit of the SAME three-term formula.
      # THE ASYMMETRY (work order Sec. 3): unlike the fixed-sp comparison
      # above, mgcv's own sp is a COMPARED QUANTITY here, not a shared input
      # — both sides choose it independently. DIAGNOSTIC ONLY, printed to
      # stdout from the start (ADR-194's methodology fix).
      - name: Compare PolarisGAM's free-sp selection against mgcv (slice 5b)
        if: always()
        continue-on-error: true
        run: |
          uv run python3 - <<'PY'
          import json
          import sys

          try:
              r_payload = json.load(open("gam_multiterm_free_sp_probe.json"))
          except (OSError, json.JSONDecodeError) as exc:
              print(f"No gam_multiterm_free_sp_probe.json to compare ({exc}) — "
                    "the R probe above did not produce one.")
              sys.exit(0)

          from polaris_re.analytics.gam_model_conformance import (
              FREE_SP_MODEL_CLAIM, compare_free_sp_case, fit_free_sp_case,
          )
          from polaris_re.core.verification import evidence_markdown

          fit = fit_free_sp_case(r_payload)
          c = compare_free_sp_case(fit, r_payload)

          lines = [
              "",
              "### Slice 5b — PolarisGAM free-sp selection vs mgcv (INDEPENDENT on every quantity)",
              "",
              evidence_markdown(FREE_SP_MODEL_CLAIM),
              "",
              "| n | p | max abs eta diff | max abs log10(sp) diff | edf_total diff | max abs per-term edf diff | at bound | agrees |",
              "|---:|---:|---:|---:|---:|---:|---|---|",
              f"| {r_payload['n']} | {len(r_payload['coef'])} | "
              f"{c.max_abs_eta_diff:.3e} | {c.max_abs_log10_sp_diff:.4f} | "
              f"{c.edf_total_diff:+.4f} | {c.max_abs_term_edf_diff:.4f} | "
              f"{c.at_bound} | {c.agrees} |",
              "",
              "`sp` is a COMPARED QUANTITY here, not a shared input (see the "
              "legend) — the work order's own asymmetry versus the fixed-sp "
              "comparison above: both sides select their own smoothing "
              "parameters independently, from the same already-verified "
              "REML criterion (ADR-196/197/199). A disagreement localises to "
              "lambda selection on this N=4-block design, not to the bases, "
              "fitter or criterion, all unchanged from the fixed-sp "
              "measurement. Coefficients are NOT compared (Anchor 2).",
          ]
          if not c.agrees:
              lines.insert(2, "**Disagreement on log10(sp) — see the table. This is a genuine finding.**")

          report = "\n".join(lines) + "\n"
          with open("gam_multiterm_free_sp_probe_report.md", "w") as fh:
              fh.write(report)
          print(report)
          PY
          if [ -f gam_multiterm_free_sp_probe_report.md ]; then
            cat gam_multiterm_free_sp_probe_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # PLAN slice 5c sequencing step 1 (tier-3 baseline) — the eight-point
      # fixed-sp spread, both before Defects A/B (raw) and after (this
      # branch's reml_score_general, which already carries the fix — the
      # "before" figure is the tier-1 measurement in the ADR, re-derived
      # here isn't possible without checking out the pre-fix commit).
      # DIAGNOSTIC ONLY (reads mgcv's own gcv.ubre) — printed to stdout
      # directly by the script itself, same discipline as the slice 4 part
      # A step below.
      - name: Fixed-sp REML score spread vs mgcv, Appendix B + observed-Hessian weight (slice 5c)
        if: always()
        continue-on-error: true
        run: |
          if [ -f gam_fixed_sp_score_probe.json ]; then
            {
              echo ""
              echo "### Slice 5c — fixed-sp REML score spread vs mgcv (Defects A + B)"
              echo '```'
              uv run python scripts/gam_fixed_sp_score_compare.py gam_fixed_sp_score_probe.json
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No gam_fixed_sp_score_probe.json to compare — the R probe did not produce one." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Slice 4 part A: compares the independent Python REML score
      # (gam_reml.reml_score_general on an independently-converged
      # gam_fit.penalized_irls_general fit) against job 1's mgcv gcv.ubre on
      # the SAME shared two-block binomial design at three fixed sp points —
      # on PAIRWISE DIFFERENCES, not the absolute value (see
      # gam_reml_conformance.py's module docstring for why). DIAGNOSTIC ONLY,
      # printed to stdout from the start (the methodology fix ADR-194 needed
      # partway through slice 2), so a tier-3 read never has to settle for
      # "the step didn't except."
      - name: Compare the two-block REML score against the Python side (slice 4 part A)
        if: always()
        continue-on-error: true
        run: |
          uv run python3 - <<'PY'
          import json
          import sys

          try:
              r_payload = json.load(open("gam_reml_probe.json"))
          except (OSError, json.JSONDecodeError) as exc:
              print(f"No gam_reml_probe.json to compare ({exc}) — the R probe "
                    "above did not produce one.")
              sys.exit(0)

          import numpy as np

          from polaris_re.analytics.gam_reml_conformance import (
              REML_SCORE_CLAIM, compare_reml_deviance, compare_reml_points,
          )
          from polaris_re.core.verification import evidence_markdown

          x = np.asarray(r_payload["X"], dtype=np.float64)
          s1 = np.asarray(r_payload["S1"], dtype=np.float64)
          s2 = np.asarray(r_payload["S2"], dtype=np.float64)

          lines = [
              "", "### Slice 4 part A — two-block REML score vs mgcv (INDEPENDENT)", "",
              evidence_markdown(REML_SCORE_CLAIM), "",
              "#### deviance (per point, absolute — rules out a rescaled-penalty artifact)",
              "",
              "| sp | python deviance | r deviance | diff | agrees |",
              "|---|---:|---:|---:|---|",
          ]
          deviance_comparisons = compare_reml_deviance(x, s1, s2, r_payload)
          any_deviance_disagree = False
          for d in deviance_comparisons:
              if not d["agrees"]:
                  any_deviance_disagree = True
              lines.append(
                  f"| `{d['sp']}` | {d['python_deviance']:.10g} | {d['r_deviance']:.10g} | "
                  f"{d['diff']:.6g} | {d['agrees']} |"
              )
          lines += [
              "",
              "#### reml_score_pairwise_diff (the declared claim quantity)",
              "",
              "| point A | point B | python diff | r diff | residual | agrees |",
              "|---|---|---:|---:|---:|---|",
          ]
          comparisons = compare_reml_points(x, s1, s2, r_payload)
          any_score_disagree = False
          for c in comparisons:
              if not c["agrees"]:
                  any_score_disagree = True
              lines.append(
                  f"| `{c['point_a']}` | `{c['point_b']}` | {c['python_diff']:.6g} | "
                  f"{c['r_diff']:.6g} | {c['residual']:.6g} | {c['agrees']} |"
              )
          lines.append("")
          lines.append(
              "`deviance` and `reml_score_pairwise_diff` are both INDEPENDENT (see "
              "the legend): neither side reads the other's fit or score, only the "
              "shared recipe (X, S1, S2, y, weights) and the sp points themselves. "
              "`deviance` agreeing is what licenses reading a score disagreement as "
              "a formula gap rather than a rescaled-penalty artifact (mgcv's "
              "gam.control(scalePenalty=) would fit both sides at a different "
              "effective lambda and show up here first). Differencing the score "
              "pairwise cancels any purely additive convention offset between the "
              "two criteria (ADR-189 amendment 1 already found one, unresolved, "
              "even for the single-block Poisson case) — a residual surviving THAT "
              "cancellation is a real result about the multi-block formula, not a "
              "broken round trip or an artifact of the offset."
          )
          if any_score_disagree:
              lines.insert(2, "**The score disagreed on at least one pair — see the table. This is a genuine, characterized finding, not a harness bug.**")
          if any_deviance_disagree:
              lines.insert(2, "**DEVIANCE DISAGREED — the fit itself may be wrong, not just the score. See the table before trusting any score-level conclusion.**")

          report = "\n".join(lines) + "\n"
          with open("gam_reml_probe_report.md", "w") as fh:
              fh.write(report)
          print(report)
          PY
          if [ -f gam_reml_probe_report.md ]; then
            cat gam_reml_probe_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # docs/WORK_ORDER_reml_penalized_deviance_production_check.md: does the
      # SHIPPED, production experience_gam_penalized.reml_score have the same
      # missing beta_hat^T S beta_hat term ADR-196 found and fixed in
      # gam_reml.reml_score_general? Reads mgcv_reference.json (job 1, already
      # produced on every dispatch — reml_score/m$gcv.ubre was already
      # exported, so no new R work) and the COMMITTED python_reference.json
      # (never re-baselined by this step — read-only). DIAGNOSTIC ONLY, same
      # contract as every probe above: this measures against experience_gam_
      # penalized.reml_score/select_lambdas_reml/smoothing_uncertainty but
      # calls none of their production entry points for a fit that would
      # move any committed artifact, and edits none of them (PLAN Anchor 7).
      - name: Check the production REML score for the same missing term (work order)
        if: always()
        continue-on-error: true
        run: |
          uv run python scripts/reml_production_check_probe.py \
            --exchange data/mgcv_exchange/synthetic \
            --mgcv-reference mgcv_reference.json \
            > reml_production_check_report.md
          cat reml_production_check_report.md
          cat reml_production_check_report.md >> "$GITHUB_STEP_SUMMARY"

      # PLAN slice 4 part B, ADR-198's decisive test: does a continuous search
      # over log10(lambda) — never reading mgcv's own selection — land closer
      # to mgcv's own free-sp selection than the production grid does? Reads
      # mgcv_reference.json (job 1, already produced on every dispatch — the
      # free-sp `sp`/`edf_total` fields were already exported, so no new R
      # work) and the COMMITTED python_reference.json (read-only, for the
      # grid's own already-selected lambda). DIAGNOSTIC ONLY, same contract
      # as every probe above: it fits its own independent search, calling
      # none of experience_gam_penalized.py's production entry points and
      # editing none of them (PLAN Anchor 7).
      - name: Does a continuous search land closer to mgcv than the grid (slice 4 part B, ADR-198)
        if: always()
        continue-on-error: true
        run: |
          uv run python scripts/reml_continuous_optimizer_probe.py \
            --exchange data/mgcv_exchange/synthetic \
            --mgcv-reference mgcv_reference.json \
            > reml_continuous_optimizer_report.md
          cat reml_continuous_optimizer_report.md
          cat reml_continuous_optimizer_report.md >> "$GITHUB_STEP_SUMMARY"

      # Wood (2011) sections 3.4 / Appendix D — the level-4 PREREQUISITE, not level 4
      # itself. Compares this engine's analytic d(eta)/d(rho) and dw/d(rho)
      # against a central difference of mgcv's OWN refits. Prints to stdout so a
      # tier-3 reading comes from plain job-log text (the ADR-194 methodology fix).
      - name: Wood (2011) derivatives — d(eta)/d(rho) and dw/d(rho) vs mgcv
        if: always()
        continue-on-error: true
        run: |
          if [ -f gam_deriv_probe.json ]; then
            uv run python scripts/gam_deriv_compare.py \
              --probe gam_deriv_probe.json \
              --markdown gam_deriv_report.md
            cat gam_deriv_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No gam_deriv_probe.json — the R probe above did not produce one."
          fi

      # Level 4 proper — eq. (7) against mgcv's vcov(unconditional = TRUE).
      - name: Level 4 — WPS (2016) eq. (7) vs mgcv Vc
        if: always()
        continue-on-error: true
        run: |
          if [ -f gam_vc_probe.json ]; then
            uv run python scripts/gam_vc_compare.py \
              --probe gam_vc_probe.json \
              --markdown gam_vc_report.md
            cat gam_vc_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No gam_vc_probe.json — the R probe above did not produce one."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mgcv-conformance-report
          path: |
            mgcv_conformance_report.md
            mgcv_conformance.json
            mgcv_reference.json
            gam_term_extract.json
            gam_term_extract_report.md
            gam_family_probe.json
            gam_family_probe_report.md
            gam_reml_probe.json
            gam_reml_probe_report.md
            reml_production_check_report.md
            reml_continuous_optimizer_report.md
            gam_deriv_probe.json
            gam_deriv_report.md
            gam_vc_probe.json
            gam_vc_report.md
            gam_multiterm_probe.json
            gam_multiterm_probe_report.md
