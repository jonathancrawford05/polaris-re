      # CAPABILITY LADDER rung L2 (docs/PLAN_mgcv_capability_ladder.md slice
      # 2) — bs="re", Stage A: the Python re basis (gam_basis_re.re_basis)
      # against smoothCon(s(fac, bs="re")) at two level counts (4, 7), read
      # off the SAME gam_term_extract.json job 1's raw/sz/ti sections above
      # already parse, keyed on "group is not None and x is None" (a re
      # case has a factor but no smoothed margin — the one thing that tells
      # it apart from an sz case, which has both).
      - name: Compare the re basis vs smoothCon(bs="re") (ladder L2 Stage A)
        if: always()
        continue-on-error: true
        run: |
          uv run python3 - <<'PY'
          import json
          import sys

          try:
              r_payload = json.load(open("gam_term_extract.json"))
          except (OSError, json.JSONDecodeError) as exc:
              print(f"No gam_term_extract.json to compare ({exc}) — the R probe "
                    "above did not produce one.")
              sys.exit(0)

          import numpy as np

          from polaris_re.analytics.gam_stage_a import (
              RE_BASIS_CLAIM, build_python_re_term, compare_term_extract,
          )
          from polaris_re.analytics.gam_term_spec import TermSpec
          from polaris_re.core.verification import evidence_markdown

          smooth_r_terms = r_payload.get("smooth_designs", {})
          re_smooth_terms = {
              label: r_term for label, r_term in smooth_r_terms.items()
              if r_term.get("group") is not None and r_term.get("x") is None
          }
          re_cases = {"re-4level": 4, "re-7level": 7}

          lines = [
              "", "### Ladder slice 2 — Python `re` basis vs `smoothCon(bs=\"re\")` (INDEPENDENT)", "",
              evidence_markdown(RE_BASIS_CLAIM), "",
              "| term | index range agrees | max abs X diff | max abs S diff | rank diff |",
              "|---|---|---:|---:|---:|",
          ]
          any_re_disagree = False
          if re_smooth_terms:
              for label, r_term in re_smooth_terms.items():
                  if label not in re_cases:
                      lines.append(f"| `{label}` | **UNKNOWN CASE — no n_levels recipe named** | | | |")
                      any_re_disagree = True
                      continue
                  n_levels = re_cases[label]
                  term = TermSpec(label=label, variables=("fac",), basis="re", n_levels=n_levels)
                  group = np.asarray(r_term["group"], dtype=np.int64)
                  python_term = build_python_re_term(group, n_levels, term)
                  c = compare_term_extract(python_term, r_term)
                  if not c.agrees:
                      any_re_disagree = True
                  s_diff = ", ".join(f"{d:.3e}" for d in c.max_abs_s_diff) or "n/a"
                  lines.append(
                      f"| `{label}` | {c.index_range_agrees} | "
                      f"{c.max_abs_design_diff:.3e} | {s_diff} | {c.rank_diff} |"
                  )
          else:
              lines.append("| *(no re cases in R output)* | | | | |")
              any_re_disagree = True
          lines.append("")
          lines.append(
              "`design_X`, `penalty_S` and `rank` are INDEPENDENT (see the legend): "
              "the Python `re` basis is the bare level-indicator matrix and the "
              "identity penalty, built from the 0-indexed factor codes and the "
              "level count alone — no knot recipe, no constraint absorption "
              "(measured: `absorb.cons` does not change mgcv's own output for a "
              "`re` term). A disagreement is a REAL RESULT about the basis, not "
              "a broken round trip. See docs/PLAN_mgcv_capability_ladder.md slice 2."
          )
          if any_re_disagree:
              lines.insert(2, "**A term disagreed — see the table. This is a genuine finding.**")

          report = "\n".join(lines) + "\n"
          with open("gam_re_stage_a_report.md", "w") as fh:
              fh.write(report)
          print(report)
          PY
          if [ -f gam_re_stage_a_report.md ]; then
            cat gam_re_stage_a_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

