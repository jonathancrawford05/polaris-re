              "",
              evidence_markdown(SELECT_PENALTY_CLAIM),
              "",
              "| case | null dim | max abs S_null diff | agrees |",
              "|---|---:|---:|---|",
          ]
          all_agree = True
          for case, c in results.items():
              all_agree = all_agree and c.agrees
              lines.append(f"| {case} | {c.null_dim} | {c.max_abs_s_null_diff:.3e} | {c.agrees} |")
          lines += [
