# =============================================================================
# Polaris RE — CI/CD Pipeline
# =============================================================================
# Triggers:
#   - Every push to `main` or `develop`
#   - Every pull request targeting `main`
#
# Jobs:
#   1. lint      — Ruff (style + formatting) + mypy (type checking)
#   2. test      — pytest matrix across Python 3.12 and 3.13, with coverage
#   3. docker    — Build Docker image and run tests inside it
#   4. coverage  — Upload coverage report to Codecov (on main push only)
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint — Ruff + mypy
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (Ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        # --frozen: fail if uv.lock is out of sync with pyproject.toml
        run: uv sync --frozen --all-extras

      - name: Run Ruff (linting)
        run: uv run ruff check src/ tests/

      - name: Run Ruff (formatting check)
        run: uv run ruff format --check src/ tests/

      - name: Run mypy (type checking)
        # --ignore-missing-imports: stubs not required in CI for now
        run: uv run mypy src/polaris_re/ --ignore-missing-imports
        continue-on-error: true   # mypy on stubs will flag errors; non-blocking until Phase 1 complete

  # ---------------------------------------------------------------------------
  # Job 2: Test — pytest matrix across Python 3.12 and 3.13
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Generate mortality tables
        run: uv run python scripts/convert_soa_tables.py --source pymort --output-dir data/mortality_tables

      - name: Run tests (excluding slow)
        run: uv run pytest -m "not slow" tests/ -v --tb=short

      - name: Run tests with coverage (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: |
          uv run pytest tests/ \
            --cov=polaris_re \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --tb=short

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 3: Docker — build image and run tests inside container
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build & test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: polaris-re:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Run tests inside Docker
        run: |
          docker run --rm \
            polaris-re:ci-${{ github.sha }} \
            bash -c "python scripts/convert_soa_tables.py --source pymort --output-dir data/mortality_tables && python -m pytest tests/ -v --tb=short -m 'not slow'"

      - name: Smoke test — import check
        run: |
          docker run --rm \
            polaris-re:ci-${{ github.sha }} \
            python -c "import polaris_re; print('Import OK:', polaris_re.__version__)"

  # ---------------------------------------------------------------------------
  # Job 4: Smoke — boot the real entry points (uvicorn + polaris CLI)
  # ---------------------------------------------------------------------------
  # Catches "won't boot / endpoint 500s" that in-process (TestClient / direct
  # import) tests structurally cannot see: broken ASGI lifespan startup,
  # console-script packaging, import-time failures, and a crashing benchmark or
  # price entry point. Fast (~a few seconds) and gates the merge (ADR-168).
  smoke:
    name: Smoke (real entry points)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Generate mortality tables
        run: uv run python scripts/convert_soa_tables.py --source pymort --output-dir data/mortality_tables

      - name: Run smoke tests (real uvicorn + polaris CLI)
        run: uv run pytest tests/smoke -v --tb=short -m smoke

  # ---------------------------------------------------------------------------
  # Job 5: Perf — head-vs-main performance-regression harness
  # ---------------------------------------------------------------------------
  # Runs scripts/perfbench.py on ONE runner: it probes the engine hot path on
  # this PR's head and on a git-worktree checkout of origin/main in the same
  # job, so the 2-3x run-to-run machine noise cancels in the head/main ratio.
  # The job GATES (non-zero exit) only on a structural/deterministic regression
  # (mismatched counts or output fingerprint = a hard delta); the wall-time
  # ratio and the peak-MiB delta are advisory alerts printed to the log that
  # never fail the job — the maintainer's rule (2026-07-12): deterministic
  # metrics gate, raw wall-time only informs (ADR-176; PLAN_perf_harness §2).
  # PR-only: on a push to main, head and origin/main are the same commit, so
  # there is nothing to compare. The probe uses the committed synthetic fixture
  # (no mortality-table generation), so the job stays fast and offline-safe.
  perf:
    name: Perf (head-vs-main regression)
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so the git-worktree checkout of origin/main resolves.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Materialize origin/main baseline
        # Guarantee refs/remotes/origin/main exists for the worktree checkout,
        # independent of the checkout action's default fetch refspec.
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Run head-vs-main perf harness (gate on structural delta)
        # Exits non-zero ONLY on a hard delta; wall-time / peak-MiB alerts are
        # advisory (printed to stderr, never fail the job). --no-fetch: the
        # baseline is already materialized above.
        run: uv run python scripts/perfbench.py --ref origin/main --no-fetch -o perf.json

      - name: Upload perf.json
        # Upload even on failure so a regression's evidence is inspectable.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 6: Coverage report — upload to Codecov (main branch push only)
  # ---------------------------------------------------------------------------
  coverage:
    name: Upload coverage
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
